<style>
:root{
  --ink:#1b2432; --ink2:#3d4756; --mute:#7b8494; --line:#e4e7ec; --bg:#ffffff; --surf:#f4f5f7;
  --mark:#ffe873; --mark2:#f5d43a; --ok:#1e7f4f; --okbg:#e6f4ec; --ng:#b3261e; --ngbg:#fbe9e7;
  --sans:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --serif:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
body{padding-top:var(--sat);padding-bottom:calc(64px + var(--sab));overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--mark2);outline-offset:2px}
header.top{position:sticky;top:var(--sat);z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;min-height:50px;padding:6px 12px}
header.top h1{font-size:17px;font-weight:600;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:20px;margin-left:-8px;font-size:22px}
.back:active{background:var(--surf)}
.back[hidden]{display:none}
main{padding:0 18px 24px;max-width:640px;margin:0 auto}
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding-bottom:var(--sab);z-index:6}
.tabs button{flex:1;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mute)}
.tabs button.on{color:var(--ink);font-weight:600}
.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs .badge{position:absolute;margin-left:26px;margin-top:-2px;background:var(--ng);color:#fff;font-size:10px;line-height:16px;min-width:16px;padding:0 4px;border-radius:8px;text-align:center}

/* home / lists */
.part{margin-top:22px}
.part h2{font-size:13px;color:var(--mute);font-weight:600;margin:0 0 2px}
.part p.sub{margin:0 0 8px;font-size:13px;color:var(--ink2)}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 0;border-bottom:1px solid var(--line)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;font-size:15px}
.row .t span{display:block;font-size:12.5px;color:var(--mute);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .st{font-size:12px;color:var(--mute);white-space:nowrap}
.row .st.ok{color:var(--ok);font-weight:600}
.row:active{background:var(--surf);margin:0 -18px;padding-left:18px;padding-right:18px}
.hero{padding:26px 0 6px}
.hero h1{font-family:var(--serif);font-weight:600;font-size:26px;line-height:1.3;margin:0 0 6px;letter-spacing:.01em}
.hero p{margin:0;color:var(--ink2);font-size:14px}
.stat{display:flex;gap:18px;margin:14px 0 4px;font-size:13px;color:var(--mute)}
.stat b{color:var(--ink);font-weight:600;font-size:15px;margin-right:2px}

/* reading */
.lead{color:var(--ink2);font-size:14px;margin:14px 0 4px}
article h2{font-family:var(--serif);font-size:19px;font-weight:600;margin:30px 0 10px;line-height:1.4}
article p{font-family:var(--serif);font-size:17px;line-height:1.95;margin:0 0 1em;letter-spacing:.01em;text-align:justify}
.m{background:linear-gradient(transparent 55%, var(--mark) 55%);padding:0 1px;border-radius:2px;font-weight:500;cursor:pointer}
.m:active{background:linear-gradient(transparent 40%, var(--mark2) 40%)}
.m.no{background:linear-gradient(transparent 55%, #eee 55%);cursor:default}
.cta{display:block;width:100%;background:var(--ink);color:#fff;border-radius:12px;padding:15px;text-align:center;font-weight:600;font-size:16px;margin:26px 0 8px}
.cta.sec{background:var(--surf);color:var(--ink)}
.cta.sm{padding:11px;font-size:14px;margin:10px 0 0}
.chapnav{display:flex;justify-content:space-between;gap:10px;margin-top:12px;font-size:14px}
.chapnav button{color:var(--ink2);padding:10px 0}
.note{font-size:13px;color:var(--mute);margin:6px 0}

/* sheet */
.sheetbg{position:fixed;inset:0;background:rgba(27,36,50,.35);z-index:20;display:none}
.sheetbg.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;padding:14px 20px calc(20px + var(--sab));z-index:21;transform:translateY(105%);transition:transform .22s ease;max-height:70vh;overflow:auto}
.sheet.on{transform:none}
.sheet .grab{width:36px;height:4px;background:var(--line);border-radius:2px;margin:0 auto 14px}
.sheet h3{margin:0 0 6px;font-size:18px}
.sheet p{margin:0 0 14px;font-size:15px;color:var(--ink2)}
.sheet .cta{margin:4px 0 0}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}

/* quiz */
.qhead{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin:14px 0 6px}
.qbar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:18px}
.qbar i{display:block;height:100%;background:var(--ink);width:0}
.q{font-size:17px;font-weight:600;line-height:1.6;margin:0 0 18px}
.ch{display:block;width:100%;text-align:left;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;margin-bottom:10px;font-size:15px;line-height:1.5}
.ch:active{background:var(--surf)}
.ch.ok{border-color:var(--ok);background:var(--okbg)}
.ch.ng{border-color:var(--ng);background:var(--ngbg)}
.ch[disabled]{opacity:.85}
.why{background:var(--surf);border-radius:12px;padding:12px 14px;font-size:14px;margin:6px 0 14px;line-height:1.7}
.why b{display:block;margin-bottom:2px}
.why b.ok{color:var(--ok)} .why b.ng{color:var(--ng)}
.result{text-align:center;padding:30px 0 10px}
.result .big{font-family:var(--serif);font-size:44px;font-weight:600;line-height:1.1}
.result p{color:var(--ink2);margin:6px 0 0}
.opts{margin-top:14px}

/* cards */
.card{border:1.5px solid var(--line);border-radius:16px;min-height:220px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;margin:18px 0 14px;font-family:var(--serif)}
.card .k{font-size:12px;color:var(--mute);font-family:var(--sans);margin-bottom:10px}
.card .f{font-size:24px;font-weight:600;line-height:1.4}
.card .b{font-size:17px;line-height:1.7;color:var(--ink2);margin-top:14px;border-top:1px dashed var(--line);padding-top:14px;width:100%}
.two{display:flex;gap:10px}
.two .cta{margin:6px 0 0}
.two .cta.ng{background:var(--ngbg);color:var(--ng)}
.two .cta.ok{background:var(--okbg);color:var(--ok)}
.seg{display:flex;background:var(--surf);border-radius:10px;padding:3px;margin:14px 0 4px}
.seg button{flex:1;padding:7px 0;border-radius:8px;font-size:13px;color:var(--mute)}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.boxes{display:flex;gap:6px;margin:12px 0 4px}
.boxes div{flex:1;text-align:center;font-size:11px;color:var(--mute)}
.boxes b{display:block;font-size:16px;color:var(--ink)}
.empty{text-align:center;color:var(--mute);padding:40px 0;font-size:14px}
.about p{font-size:14px;color:var(--ink2)}
.about h3{font-size:15px;margin:22px 0 6px}
.about ul{padding-left:18px;font-size:13.5px;color:var(--ink2)}
.danger{color:var(--ng);font-size:13px;margin-top:26px}
</style>
</head>

<script>
// ===================== CONTENT =====================
// 章を追加するときは CHAPTERS 配列に同じ形式のオブジェクトを足す。
// 本文中の【用語】は自動でマーカー表示になり、TERMS に定義があればタップで開く。
// 各章の quiz は {q, choices:[4つ], a:正解index, why:解説}

const PARTS = [
  { id: "hist", name: "第1部 AIの物語", sub: "年号と人物を、動機でつなぐ" },
  { id: "ml",   name: "第2部 機械学習の地図", sub: "データから規則を学ぶ、その方法と採点法" },
  { id: "dl",   name: "第3部 ディープラーニングの系譜", sub: "なぜ次の技術が必要になったか" },
  { id: "app",  name: "第4部 応用と実装", sub: "音声・言語・画像から、プロジェクトの現場まで" },
  { id: "law",  name: "第5部 法律・倫理", sub: "事例から入る制度の地図" },
];

const CHAPTERS = [
{
  id: "h1", part: "hist", title: "1. 夢の始まり", lead: "1950〜1969 チューリングの問いからパーセプトロンの挫折まで",
  sections: [
   { h: "機械は考えられるか", t: `1950年、イギリスの数学者【アラン・チューリング】は「機械は考えられるか」という問いを、答えの出ない哲学論争から切り離した。判定者が文字だけで会話し、相手が人間か機械か見分けられなければ「考えている」とみなす。これが【チューリングテスト】である。人工知能という言葉はまだ存在しない。しかし「知能を外から観察できる振る舞いとして定義する」という発想は、その後の研究者たちの共通の出発点になった。` },
   { h: "1956年、ダートマスの夏", t: `6年後の1956年、【ジョン・マッカーシー】が仲間を米国ダートマス大学に集めた。前年の提案書で彼が使った造語が「Artificial Intelligence」、つまり【ダートマス会議】は人工知能という分野の命名式だった。参加者には【マービン・ミンスキー】、そして【アレン・ニューウェル】と【ハーバート・サイモン】がいた。ニューウェルとサイモンはこの場で【ロジック・セオリスト】を披露する。数学の定理を自動で証明するプログラムで、「世界初の人工知能プログラム」と呼ばれる。` },
   { h: "第1次ブーム：探索と推論", t: `ダートマス会議から1960年代にかけてが【第1次AIブーム】である。主役は【探索・推論】。迷路やパズルを「状態の木」として表し、幅優先・深さ優先で答えを探す。チェスの手も同じ発想で読める。1966年、【ジョセフ・ワイゼンバウム】が対話プログラム【ELIZA】を作ると、単純なパターン置換にすぎないのに人々は心を開いて話しかけた。この「機械に人格を見てしまう現象」は今も【イライザ効果】と呼ばれる。` },
   { h: "パーセプトロンと、最初の冬", t: `一方で脳をまねる路線もあった。1958年、【フランク・ローゼンブラット】が【パーセプトロン】を発表する。入力に重みを掛けて足し、しきい値を超えたら発火する。学習で重みが変わるという点が画期的だった。しかし1969年、ミンスキーと【シーモア・パパート】が著書『パーセプトロン』で、単純パーセプトロンは【XOR】のような線形分離できない問題を解けないと示した。ブームの主役だった探索・推論も、現実の複雑さには歯が立たなかった。解けるのは【トイ・プロブレム】だけ。1970年代、資金は引き上げられ、【第1次AIの冬】が来る。` },
  ],
  quiz: [
   { q: "「Artificial Intelligence」という言葉を初めて用いた人物と、その場となった会議の組み合わせとして正しいものはどれか。", choices: ["ミンスキー／ダートマス会議", "マッカーシー／ダートマス会議", "チューリング／マンチェスター会議", "サイモン／ランド会議"], a: 1, why: "1956年のダートマス会議を主催したマッカーシーが、前年の提案書で命名した。" },
   { q: "ロジック・セオリストを開発した人物はどれか。", choices: ["ローゼンブラット", "ワイゼンバウム", "ニューウェルとサイモン", "マッカーシー"], a: 2, why: "ロジック・セオリスト（1956）はニューウェルとサイモン（およびショー）による、世界初とされるAIプログラム。" },
   { q: "第1次AIブームの中心的な技術はどれか。", choices: ["知識表現とエキスパートシステム", "探索・推論", "機械学習", "ディープラーニング"], a: 1, why: "第1次＝探索・推論、第2次＝知識、第3次＝機械学習・深層学習、と対応させて覚える。" },
   { q: "1969年にミンスキーとパパートが指摘した単純パーセプトロンの限界とは何か。", choices: ["学習に時間がかかりすぎる", "線形分離不可能な問題（XORなど）を解けない", "多層にすると発散する", "数値データしか扱えない"], a: 1, why: "XOR問題。この指摘がニューラルネット研究の停滞（冬）の一因になった。" },
   { q: "ELIZAに関する説明として正しいものはどれか。", choices: ["1966年にワイゼンバウムが開発した対話プログラムで、人が機械に感情を投影する『イライザ効果』の語源", "1958年にローゼンブラットが開発した学習機械", "IBMが開発したクイズ番組用の質問応答システム", "スタンフォード大学の医療診断エキスパートシステム"], a: 0, why: "ELIZAはパターン置換の単純な仕組みだが、利用者は「理解されている」と感じた。" },
  ]
},
{
  id: "h2", part: "hist", title: "2. 知識の時代と第2の冬", lead: "1970〜1990年代前半 エキスパートシステムの栄光と限界",
  sections: [
   { h: "知識を詰め込めば賢くなる", t: `冬を越えるヒントは「専門家の知識を機械に入れる」ことだった。1960年代後半、スタンフォード大学の【エドワード・ファイゲンバウム】らは、質量分析データから化合物の構造を推定する【DENDRAL】を作った。続いて1970年代には感染症の診断と抗生物質の処方を助ける【MYCIN】が生まれる。IF-THEN形式のルールを数百個持ち、専門医に近い精度を示した。こうした「専門家の知識ベース＋推論エンジン」を【エキスパートシステム】と呼び、1980年代の【第2次AIブーム】の主役になった。` },
   { h: "日本の挑戦：第五世代コンピュータ", t: `1982年、日本の通商産業省は10年計画の【第五世代コンピュータ】プロジェクトを始める。論理推論をハードウェアで高速化し、知識処理に特化した計算機を作る国家事業だった。米欧はこれに刺激され対抗プロジェクトを立ち上げる。同じ頃、米国では【ダグラス・レナート】が「常識」を丸ごと記述する【Cyc】プロジェクトを1984年に開始した。人間なら当然知っていることを一つずつ手で書く、終わりの見えない作業である。` },
   { h: "知識の壁", t: `エキスパートシステムはやがて壁にぶつかる。第一に【知識獲得のボトルネック】。専門家の暗黙知を聞き出しルールにする作業が膨大で、矛盾も生じた。第二に、機械は記号を扱えても意味を知らない。1980年、哲学者【ジョン・サール】は【中国語の部屋】という思考実験で、ルール通りに記号を並べ替えるだけの存在を「理解している」とは言えないと論じた。これを踏まえ1990年に【スティーブン・ハルナッド】が【シンボルグラウンディング問題】として定式化する。記号（シンボル）が現実世界の対象と結びついていない、という問題だ。また、ある行動に関係する事柄だけを取り出す難しさは、1969年のマッカーシーらの論文以来【フレーム問題】と呼ばれていた。` },
   { h: "静かな胎動と、第2の冬", t: `ブームの裏で、ニューラルネットは復活の準備をしていた。1986年、【デビッド・ラメルハート】と【ジェフリー・ヒントン】らが多層ネットワークを学習させる【誤差逆伝播法】を広めた。XOR問題は隠れ層を入れれば解ける。ただし当時の計算機と少ないデータでは、層を深くすると学習が進まない。1990年代前半、第五世代コンピュータは目標を達成できず終了し、エキスパートシステムへの期待もしぼんで【第2次AIの冬】が訪れた。しかし1997年、IBMの【ディープ・ブルー】がチェス世界王者【ガルリ・カスパロフ】を破る。探索と計算力の勝利であり、次の時代の予告でもあった。` },
  ],
  quiz: [

   { q: "第五世代コンピュータプロジェクトが開始された年はどれか。", choices: ["1972年", "1982年", "1992年", "2002年"], a: 1, why: "1982年に通産省主導で開始、約10年で終了。第2次ブームの象徴。" },
   { q: "「記号と現実世界の対象が結びついていない」という問題を指す用語はどれか。", choices: ["フレーム問題", "シンボルグラウンディング問題", "知識獲得のボトルネック", "モラベックのパラドックス"], a: 1, why: "ハルナッド（1990）。フレーム問題は「関係ある事柄だけを選び出せない」問題。" },
   { q: "1986年に誤差逆伝播法を多層ニューラルネットの学習法として広めた研究者の組み合わせはどれか。", choices: ["ミンスキーとパパート", "ラメルハートとヒントン", "ルカンとベンジオ", "サールとハルナッド"], a: 1, why: "Rumelhart, Hinton, Williams (1986)。ヒントンは後に深層学習の父と呼ばれる。" },
   { q: "1997年にチェス世界王者カスパロフを破ったシステムはどれか。", choices: ["Watson", "AlphaGo", "Deep Blue", "Ponanza"], a: 2, why: "Watsonは2011年クイズ番組、AlphaGoは2016年囲碁、Ponanzaは将棋（2013年に電王戦で現役プロに勝利）。" },

{
  id: "k1", part: "hist", title: "探索と知識のしくみ", lead: "第1次・第2次ブームを支えた道具箱と、AIのレベル分類",
  sections: [
   { h: "迷路を木に変える", t: `第1次ブームの探索は、問題を「状態」と「遷移」の木として描くことから始まる。【ハノイの塔】や迷路がその教材だった。近い順にしらみつぶしに調べる【幅優先探索】は最短経路を見つけやすいがメモリを大量に使い、一本道を奥まで進んでから戻る【深さ優先探索】はメモリに優しいが最短の保証がない。可能性を全部調べる【ブルートフォース】はチェスでは通用したが、囲碁のように場合の数が爆発する問題では破綻する。そこで生まれたのがコスト見積もりで候補を絞る【ヒューリスティック】である。` },
   { h: "相手がいるゲームを読む", t: `二人で交互に打つゲームでは、自分の手番では評価値が最大、相手の手番では最小になる手が選ばれると仮定して読み進める。これが【Mini-Max法】だ。ただし全部読むと時間が足りない。結果に影響しない枝を途中で打ち切るのが【αβ法】で、答えはMini-Max法と同じまま計算量だけを減らす。囲碁では評価関数を人手で作ること自体が難しかった。局面からランダムに終局まで打ってみて勝率で評価する【モンテカルロ法】が突破口になり、AlphaGoのモンテカルロ木探索に受け継がれた。` },
   { h: "知識を書き表す", t: `第2次ブームの知識表現にも道具がある。概念を節点、関係を矢印で結ぶ【意味ネットワーク】では、「犬 is-a 動物」のような上位下位の関係を【is-a】、「タイヤ part-of 自動車」のような全体部分の関係を【part-of】で表す。概念どうしの関係を体系的に整理したものが【オントロジー】で、人が厳密に設計するヘビーウェイト型と、データから自動で拾うライトウェイト型に分かれる。行動計画では「前提条件・行動・結果」の3要素で世界を記述する【STRIPS】が古典だ。1970年代の【SHRDLU】は積み木の世界で自然言語の指示を理解し物体を動かしたが、限定された世界でしか成立しなかった。` },
   { h: "AIの4つのレベル", t: `「AI」と呼ばれるものはレベルで整理できる。レベル1は入出力の対応を人が全部決めた【単純な制御プログラム】、エアコンの温度制御などだ。レベル2は探索・推論や知識ベースで振る舞う【古典的な人工知能】、将棋プログラムや診断システムがここに入る。レベル3はデータから判断基準を学ぶ【機械学習】、レベル4は特徴量まで自ら獲得する【ディープラーニング】である。環境を知覚し、自律的に判断して行動する主体を【エージェント】と呼ぶ。またAIが人間の知能を超え、文明が予測不能な変化を迎える時点を【シンギュラリティ】と呼び、レイ・カーツワイルは2045年と予測した。` },
  ],
  quiz: [
   { q: "幅優先探索と深さ優先探索の比較として正しいものはどれか。", choices: ["深さ優先探索は必ず最短経路を見つける", "幅優先探索は最短経路を見つけやすいが、メモリ消費が大きくなりやすい", "幅優先探索は常にメモリ消費が小さい", "両者の計算量は常に同じである"], a: 1, why: "幅優先は近い順に全部調べるので最短解に強いがメモリを食う。深さ優先はその逆。" },
   { q: "αβ法の役割として正しいものはどれか。", choices: ["評価関数を機械学習で獲得する", "Mini-Max探索で結果に影響しない枝を打ち切り、計算量を減らす", "探索木を無制限に広げる", "乱数で局面を評価する"], a: 1, why: "探索結果はMini-Max法と同じで、計算量だけが減る。" },
   { q: "意味ネットワークで「タイヤは自動車の一部である」という関係を表すのはどれか。", choices: ["is-a", "part-of", "has-value", "instance-of"], a: 1, why: "part-ofは全体と部分、is-aは上位概念と下位概念の関係。" },
   { q: "人工知能のレベル分類で、探索木をたどって最善手を決める将棋プログラムはどのレベルか。", choices: ["レベル1：単純な制御プログラム", "レベル2：古典的な人工知能", "レベル3：機械学習", "レベル4：ディープラーニング"], a: 1, why: "探索・推論や知識ベースで振る舞うものがレベル2。制御機構はレベル1、学習するものはレベル3・4。" },
   { q: "SHRDLUの説明として正しいものはどれか。", choices: ["積み木の世界で自然言語の指示を解釈し物体を操作した初期の対話システム", "血液感染症の診断を支援したエキスパートシステム", "行動計画を前提条件・行動・結果で記述する手法", "囲碁の局面をランダムなプレイアウトで評価する手法"], a: 0, why: "テリー・ウィノグラードが開発。診断はMYCIN、行動計画はSTRIPS、プレイアウトはモンテカルロ法。" },
  ]
},
{
  id: "h3", part: "hist", title: "3. データが知能を育てる", lead: "1990年代後半〜2017 機械学習からディープラーニングへ",
  sections: [
   { h: "ルールを書くのをやめる", t: `第2の冬から抜け出す鍵は、発想の逆転だった。人がルールを書くのではなく、データからルールを機械に見つけさせる。これが【機械学習】である。1990年代後半、インターネットの普及で大量のデータが手に入り、【サポートベクターマシン】（1995年、【ウラジミール・ヴァプニク】ら）など統計的手法が実用化した。迷惑メールの判定や検索エンジンのランキングは、こうした機械学習の産物である。1998年には【ヤン・ルカン】が手書き数字認識用の畳み込みネットワーク【LeNet】を発表し、郵便番号の読み取りに使われた。` },
   { h: "深くしても学習できる", t: `層を深くすると学習が進まない、という問題を破ったのは2006年のヒントンである。【オートエンコーダ】を積み重ねて一層ずつ事前学習させれば、深いネットワークでも初期値を良い場所に置けると示した。「ディープラーニング」という言葉が広まり始めた瞬間だ。さらに必要なのは大量のラベル付き画像だった。2009年、【フェイフェイ・リー】らが1400万枚超の画像に人手でラベルを付けた【ImageNet】を公開する。翌2010年からその一部を使った画像認識コンテスト【ILSVRC】が始まった。` },
   { h: "2012年、すべてが変わった", t: `2011年、IBMの【Watson】がクイズ番組ジョパディで人間王者を破った。これは自然言語処理と検索の勝利だった。決定的だったのは2012年である。ILSVRCでヒントン研究室の【アレックス・クリジェフスキー】らが出した【AlexNet】が、誤り率を前年優勝の約26%から約16%へと一気に下げた。GPUで訓練した8層のCNNである。同年、Googleの【アンドリュー・ン】らのチームはYouTube動画から教師なしで「猫」の特徴を学習させ（【Googleの猫】）、深層学習の力を世に知らしめた。ここから【第3次AIブーム】が本格化する。` },
   { h: "加速する5年間", t: `2014年、【イアン・グッドフェロー】が本物そっくりの画像を生成する【GAN】を提案。同年ILSVRCでは【VGG】と【GoogLeNet】が競い、2015年には【何愷明（カイミン・ヘー）】らの【ResNet】が152層で人間の認識精度を上回った。2016年3月、DeepMind（創業者【デミス・ハサビス】）の【AlphaGo】が囲碁の【イ・セドル】九段に4勝1敗。囲碁は探索空間が広すぎて当分無理と言われていたが、深層学習と強化学習の組み合わせがそれを覆した。そして2017年、Googleの研究者【アシシュ・ヴァスワニ】らが論文「Attention Is All You Need」で【Transformer】を発表する。次の時代の土台である。` },
  ],
  quiz: [
   { q: "ILSVRC 2012で優勝し、第3次AIブームの火付け役となったモデルはどれか。", choices: ["LeNet", "AlexNet", "VGG", "ResNet"], a: 1, why: "AlexNet（ヒントン研究室）。LeNetは1998年、VGGは2014年、ResNetは2015年。" },
   { q: "ImageNetを構築した中心人物はどれか。", choices: ["フェイフェイ・リー", "アンドリュー・ン", "ヤン・ルカン", "ヨシュア・ベンジオ"], a: 0, why: "リー（李飛飛）が2009年に公開。深層学習ブームの「データ」側の基盤。" },
   { q: "2016年にプロ棋士イ・セドルに勝利した囲碁AIの開発企業はどれか。", choices: ["IBM", "OpenAI", "DeepMind", "Microsoft"], a: 2, why: "DeepMind（Google傘下、創業者ハサビス）のAlphaGo。翌年のAlphaGo Zeroは自己対局のみで学習。" },
   { q: "2006年のヒントンの研究で、深いネットワークの学習を可能にした手法として正しいものはどれか。", choices: ["ドロップアウトによる正則化", "オートエンコーダを積み重ねた事前学習", "ReLU活性化関数の導入", "バッチ正規化"], a: 1, why: "積層オートエンコーダ／DBNによる層ごとの事前学習。ReLUやドロップアウトの普及はAlexNet（2012）以降。" },
   { q: "「Attention Is All You Need」（2017）で提案されたモデルはどれか。", choices: ["LSTM", "seq2seq", "Transformer", "BERT"], a: 2, why: "Transformer（ヴァスワニら、Google）。BERTとGPTはその翌年2018年にTransformerを基に登場。" },
  ]
},
{
  id: "h4", part: "hist", title: "4. 生成AIの時代", lead: "2018〜現在 基盤モデルと、日本の視点",
  sections: [
   { h: "読む機械と、書く機械", t: `Transformerはすぐに二つの系統に分かれた。2018年、Googleは符号化器（エンコーダ）側を使う【BERT】を発表し、文章の穴埋めで事前学習させて読解タスクの精度を塗り替えた。同年、OpenAIは復号器（デコーダ）側を使う【GPT】を発表する。次の単語を予測し続けることで文章を書く。2019年のGPT-2、2020年の【GPT-3】（約1750億パラメータ）と規模を上げるたびに性能が伸び、2020年にはOpenAIの【カプラン】らがモデルサイズ・データ量・計算量と性能の関係を【スケーリング則】として示した。「大きくすれば賢くなる」が実証されたのである。` },
   { h: "基盤モデルという考え方", t: `2021年、スタンフォード大学の研究者らは、大量データで事前学習し多様なタスクに転用できるモデルを【基盤モデル】と名付けた。同年OpenAIは画像とテキストを結びつける【CLIP】と、文章から画像を生成する【DALL·E】を公開。2022年には【拡散モデル】を使った【Stable Diffusion】がオープンに公開され、誰でも画像生成ができるようになった。そして2022年11月30日、【ChatGPT】が公開される。GPT-3.5に【RLHF】（人間のフィードバックによる強化学習）を施し、対話に最適化したものだった。2か月で利用者1億人。2023年3月には画像も扱える【GPT-4】が続いた。` },
   { h: "日本のAI研究者たち", t: `日本にも節目がある。2011年、国立情報学研究所の【新井紀子】が「ロボットは東大に入れるか」（【東ロボくん】）を開始し、2016年に「読解力の壁」を理由に東大合格を断念した。この結果はAIの限界を社会に示した。将棋では2013年の電王戦で【Ponanza】が現役プロ棋士に勝利。東京大学の【松尾豊】は深層学習を「特徴表現学習」として位置づけ、日本ディープラーニング協会（JDLA、G検定の実施団体）の理事長を務める。第2次ブームまでの日本の強みは知識処理、第3次では産業応用が課題とされている。` },
   { h: "ブームを俯瞰する", t: `三つのブームを並べると、主役の技術が「探索・推論」→「知識」→「機械学習・深層学習」と移り、冬を挟んで蓄積が次の春を作ったことがわかる。もう一つ覚えておきたいのが【AI効果】である。あるAIが実現すると「それは単なる計算で知能ではない」と人々が言い出し、ゴールが動く。チェスも囲碁も翻訳も、そう扱われてきた。また、知能の分類として、特定の課題だけを解く【特化型AI】と、人間のようにあらゆる課題に対応する【汎用AI】（AGI）、意識や心を持つと主張する【強いAI】と道具として振る舞う【弱いAI】（サールの用語）も区別しておこう。` },
  ],
  quiz: [
   { q: "BERTとGPTの違いとして正しいものはどれか。", choices: ["BERTはデコーダ型、GPTはエンコーダ型", "BERTはエンコーダ型で穴埋め学習、GPTはデコーダ型で次単語予測", "BERTは画像用、GPTはテキスト用", "BERTはOpenAI、GPTはGoogleが開発"], a: 1, why: "BERT＝Google・エンコーダ・Masked LM。GPT＝OpenAI・デコーダ・自己回帰。" },
   { q: "「基盤モデル（Foundation Model）」という用語を提唱したのはどこか。", choices: ["OpenAI", "スタンフォード大学", "DeepMind", "日本ディープラーニング協会"], a: 1, why: "2021年、スタンフォード大学（CRFM）の報告書で提唱。" },
   { q: "ChatGPTが公開された時期として正しいものはどれか。", choices: ["2020年6月", "2021年11月", "2022年11月", "2023年3月"], a: 2, why: "2022年11月30日。2023年3月はGPT-4の公開。" },
   { q: "ある技術が実現すると「それは知能ではない」とみなされ、AIの定義が動いていく現象を何というか。", choices: ["イライザ効果", "AI効果", "フレーム問題", "モラベックのパラドックス"], a: 1, why: "AI効果。イライザ効果は機械に人格を感じる現象。" },
   { q: "「ロボットは東大に入れるか」プロジェクトを主導した研究者はどれか。", choices: ["松尾豊", "新井紀子", "杉山将", "甘利俊一"], a: 1, why: "新井紀子（国立情報学研究所）。2016年に読解力を理由に東大合格を断念。" },
  ]
},
{
  id: "m1", part: "ml", title: "正解つきで学ぶ：教師あり学習", lead: "回帰と分類、線形モデル、SVM、決定木、アンサンブル",
  sections: [
   { h: "数を当てるか、種類を当てるか", t: `特徴量と正解ラベルのペアから規則を学ぶのが【教師あり学習】である。出力が明日の気温のような連続値なら【回帰】、スパムか否かのような離散カテゴリなら【分類】と呼ぶ。最も古い道具は【線形回帰】で、説明変数が1つなら【単回帰分析】、複数なら【重回帰分析】という。重回帰では説明変数どうしの相関が強いと係数の推定が不安定になる【多重共線性】に注意する。分類の基本は【ロジスティック回帰】で、線形の式をシグモイド関数に通して0〜1の確率を出す。回帰という名前だが分類に使う。` },
   { h: "境界から最も遠くに線を引く", t: `【サポートベクターマシン】（SVM）は、クラスを分ける境界と最も近いデータ点との距離、すなわち【マージン】を最大にする境界を選ぶ。境界に最も近い点を【サポートベクター】と呼ぶ。完全には分けられないデータには、誤分類をある程度許す【ソフトマージン】（スラック変数）を使う。直線で分けられないデータは高次元空間に写像すれば分けられることがあり、写像後の座標を計算せずに内積だけを求める【カーネルトリック】で計算量を抑える。1990年代の機械学習の主役だった。` },
   { h: "質問を繰り返して分ける", t: `【決定木】は「年齢は30歳以上か」のような質問を繰り返してデータを分ける。分岐は、分けた後に【ジニ不純度】や【情報利得】（エントロピーの減少）がどれだけ改善するかで決める。分岐条件が可視化でき、特徴量のスケーリングも要らない。ただし単体では深く育てるほど過学習しやすい。似た発想の【k近傍法】は、新しいデータに最も近いk個の学習データの多数決で分類する。学習時は何もしない怠惰な方法で、データが増えると推論が重くなる。` },

  sections: [
   { h: "似たものを集める", t: `正解ラベルなしに、データの構造そのものを見つけるのが【教師なし学習】だ。代表がデータをグループに分ける【クラスタリング】である。【k-means法】はクラスタ数kを先に決め、各点を最も近い重心に割り当てて重心を更新する、を繰り返す。速いが初期値で結果が変わる。一方【階層的クラスタリング】は近いものから順に統合していき、その過程を樹形図【デンドログラム】で描く。統合の基準にはクラスタ内の分散の増加が最小になる【ウォード法】などがある。` },
   { h: "情報を保ったまま次元を減らす", t: `特徴量が増えるほどデータは空間の中で疎になり、必要なデータ量が指数的に増える。これが【次元の呪い】だ。対策が【次元削減】である。【主成分分析】（PCA）はデータの分散が最大になる方向に軸を取り直し、少数の軸で情報の大半を表す。各軸がどれだけ分散を説明するかが【寄与率】で、累積寄与率を見て残す軸数を決める。数学的には行列を分解する【特異値分解】と密接に関係する。可視化には高次元データを2〜3次元に非線形に埋め込む【t-SNE】がよく使われるが、局所的な近さは保たれてもクラスタ間の距離や大きさに意味はない。距離関係をなるべく保って低次元に配置する【多次元尺度構成法】もある。` },
   { h: "この商品を買った人は", t: `推薦システムには二つの流儀がある。【協調フィルタリング】はユーザーの行動履歴の類似性を使い、「この商品を買った人はこれも買っている」と勧める。ただし新規ユーザーや新商品には履歴がないため推薦できない。これが【コールドスタート問題】だ。もう一つの【コンテンツベースフィルタリング】は商品の属性の類似性で勧めるので履歴がなくても動く。実務では両者を組み合わせたハイブリッド構成が定石である。` },
   { h: "文書の裏にある話題", t: `文書には複数の話題が混ざっている。文書が複数の潜在的なトピックの混合として生成されると仮定し、その割合を推定するのが【トピックモデル】で、代表的な手法が【潜在的ディリクレ配分法】（LDA）である。「この記事は政治6割、経済4割」のように表せる。クラスタリングがデータを一つのグループに割り当てるのに対し、トピックモデルは混合比を出す点が違う。教師なし学習は正解がないぶん結果の妥当性を客観的に評価しにくい、という弱点も覚えておきたい。` },

   { q: "主成分分析（PCA）の目的として正しいものはどれか。", choices: ["情報の損失を抑えつつ、分散が最大になる方向に軸を取り直して次元を削減する", "データをクラスタに分割する", "欠損値を補完する", "分類境界のマージンを最大化する"], a: 0, why: "各主成分の情報保持量は寄与率で評価する。" },

{
  id: "m3", part: "ml", title: "試して学ぶ：強化学習の基礎", lead: "マルコフ決定過程、価値関数、探索と活用、Q学習と方策勾配",
  sections: [
   { h: "五つの登場人物", t: `強化学習は【エージェント】が【環境】の中で試行錯誤する枠組みである。エージェントは環境の【状態】を観測して【行動】を選び、環境は次の状態と【報酬】を返す。目的は、目先の報酬ではなく将来にわたる累積報酬を最大にする【方策】を見つけること。この設定を数学的に整理したのが【マルコフ決定過程】で、次の状態と報酬が現在の状態と行動だけで決まり、それ以前の履歴に依存しないという【マルコフ性】を仮定する。この仮定のおかげで価値を再帰的に計算できる。` },
   { h: "将来をどれだけ重く見るか", t: `将来の報酬を今の価値に換算するとき、1ステップ先ごとに【割引率】γ（0〜1）を掛ける。γが1に近いほど長期的な報酬を、0に近いほど目先の報酬を重視する。ある状態から方策に従って行動したときの期待累積報酬が【状態価値関数】、ある状態で特定の行動を取ったときの期待累積報酬が【行動価値関数】（Q関数）である。価値関数さえ正しく分かれば、各状態で価値が最大の行動を選ぶだけで最適に振る舞える。` },
   { h: "冒険するか、堅実にいくか", t: `常に今いちばん良いと思う行動だけを取っていると、もっと良い行動を見逃す。未知の行動を試す【探索】と、良いと分かった行動を選ぶ【活用】のバランスが強化学習の永遠の課題だ。最も単純な折衷が、確率εでランダムに行動しそれ以外は最良の行動を選ぶ【ε-greedy方策】。推定価値に加えて試行回数が少ない選択肢にボーナスを与える【UCB方策】もある。この問題を純粋に取り出したのが、どのレバーが当たりか分からないスロットマシンを引き続ける【多腕バンディット問題】で、Web広告の最適化などに使われる。` },
   { h: "価値を学ぶか、方策を学ぶか", t: `学習法は大きく二系統ある。一つは行動価値関数を更新していく価値ベースの手法で、代表が【Q学習】。更新時に「次の状態では最良の行動を取る」と仮定する方策オフ型である。実際に選んだ次の行動で更新する方策オン型が【SARSA】で、探索の影響を含むぶん保守的な方策になりやすい。もう一つは方策そのものをパラメータ化して直接最適化する【方策勾配法】で、代表が【REINFORCE】。両者を組み合わせ、方策を学ぶActorと価値を学ぶCriticを同時に訓練するのが【Actor-Critic】である。Q関数をディープニューラルネットワークで近似したDQN以降の話は第3部の章に続く。` },
  ],
  quiz: [
   { q: "強化学習の枠組みを構成する要素として正しい組み合わせはどれか。", choices: ["特徴量・正解ラベル・損失関数", "エージェント・環境・状態・行動・報酬", "クエリ・キー・バリュー", "入力層・隠れ層・出力層"], a: 1, why: "試行錯誤を通じて累積報酬を最大化する方策を学ぶ。" },
   { q: "強化学習における割引率γの役割はどれか。", choices: ["将来得られる報酬をどれだけ重視するかを決める", "学習率を段階的に下げる", "過学習を抑える正則化係数である", "探索の乱数幅を決める"], a: 0, why: "1に近いほど長期的報酬を、0に近いほど目先の報酬を重視する。" },
   { q: "ε-greedy方策の説明として正しいものはどれか。", choices: ["常に現時点で価値が最大の行動を選ぶ", "常にランダムに行動する", "報酬が負のときだけ探索する", "確率εでランダムに探索し、それ以外は価値が最大の行動を選ぶ"], a: 3, why: "探索と活用のトレードオフに対する最も基本的な折衷策。" },

   { q: "SARSAとQ学習の違いとして正しいものはどれか。", choices: ["SARSAは教師あり学習の手法である", "SARSAは実際に選択した次の行動で更新する方策オン型、Q学習は最適行動を仮定して更新する方策オフ型である", "Q学習は報酬を使わない", "両者は同一のアルゴリズムである"], a: 1, why: "SARSAは探索の影響を含めて学習するため、より保守的な方策になりやすい。" },

{
  id: "m4", part: "ml", title: "本当に使えるか：モデルの評価と選択", lead: "データ分割、交差検証、回帰の指標、不均衡データ、情報量規準",
  sections: [
   { h: "手持ちのデータを分ける", t: `モデルの良し悪しは、学習に使っていないデータで測る。データを学習用と検証用に一度だけ分けるのが【ホールドアウト検証】で、簡便だが分け方で結果が変動し、データが少ないと不安定になる。そこでデータをk等分し、k−1個で学習して残り1個で検証する組み合わせをk回繰り返して平均するのが【k-分割交差検証】である。極端にkをデータ件数まで増やし、1件ずつ検証に使うのが【Leave-One-Out交差検証】だ。分類では各分割にクラスの比率を保つ【層化抽出】を使うと安定する。` },
   { h: "未来を覗いてはいけない", t: `時系列データを全期間からランダムに分割すると、未来の情報が学習に混ざり、性能を過大評価する。予測時点では手に入らない情報が学習に混入することを【データリーケージ】と呼び、時系列では過去で学習して未来で検証する時系列分割が必須である。もう一つの罠が【不均衡データ】だ。陽性が1%しかないデータで「全部陰性」と答えると正解率は99%になるが、目的は何も達成していない。混同行列を確認し、再現率やAUCなど目的に合った指標を選ぶ。` },
   { h: "回帰をどう採点するか", t: `回帰の評価には、誤差の絶対値の平均【MAE】と、二乗平均の平方根【RMSE】がある。RMSEは二乗するぶん大きな誤差を強く罰するので、大外れを重く見たいならRMSE、外れ値の影響を抑えたいならMAEを選ぶ。モデルがデータの分散をどれだけ説明できたかを0〜1で表すのが【決定係数】（R²）である。過学習の兆候は、訓練誤差が下がり続けるのに検証誤差が途中から上がり始めること。訓練誤差も検証誤差も高いままなら未学習である。` },
   { h: "単純なほうを選べ", t: `同程度に説明できるなら、より単純なモデルを選ぶべきだという原則を【オッカムの剃刀】という。これを数式にしたのが情報量規準で、当てはまりの良さからパラメータ数の罰則を引いた【赤池情報量規準】（AIC）と、サンプルサイズが大きいほど罰則が強くなり、より簡素なモデルを選びやすい【ベイズ情報量規準】（BIC）がある。どちらも値が小さいほど良い。モデルの誤差は、単純すぎて捉えきれない【バイアス】と、データに敏感すぎて揺れる【バリアンス】に分解でき、両者のトレードオフの中で適切な複雑さを探すのがモデル選択である。` },

  quiz: [

{
  id: "d1", part: "dl", title: "5. ニューロン一個から始める", lead: "パーセプトロン、活性化関数、多層化",
  sections: [
   { h: "重みを掛けて、足して、判断する", t: `ディープラーニングの最小部品は一個の人工ニューロンである。入力x1, x2, …に【重み】w1, w2, …を掛けて足し、【バイアス】bを加える。その合計をある関数に通して出力を決める。この関数を【活性化関数】と呼ぶ。ローゼンブラットの【単純パーセプトロン】では、合計がしきい値を超えたら1、超えなければ0を出す【ステップ関数】だった。学習とは、正解に近づくように重みとバイアスを少しずつ動かすことにほかならない。` },
   { h: "一本の直線で分けられない", t: `単純パーセプトロンは、平面上に一本の直線を引いて「こちら側は1、あちら側は0」と分けている。これを【線形分離】という。AND や OR は直線一本で分けられるが、【XOR】は分けられない。これがミンスキーの指摘だった。解決策は、ニューロンを層にして重ねることである。入力層と出力層の間に【隠れ層】を置いた【多層パーセプトロン】なら、直線を曲げたり組み合わせたりできる。層を多く（深く）したものが、文字通りディープなニューラルネットワークだ。` },
   { h: "なぜ活性化関数が必要か", t: `層を重ねても、各ニューロンが「足し算」しかしなければ、全体はどれだけ重ねても一本の直線と同じになる。曲がりを生むのが非線形の活性化関数である。古典的なのは0〜1の滑らかなS字を描く【シグモイド関数】と、−1〜1の【tanh】。現在の主流は入力が正ならそのまま、負なら0を出す【ReLU】である。出力層では、分類問題なら各クラスの確率を合計1になるよう整える【ソフトマックス関数】、二値分類ならシグモイド、回帰なら何も通さない恒等関数を使う。` },

{
  id: "d2", part: "dl", title: "6. 学習するということ", lead: "損失関数、勾配降下法、誤差逆伝播、最適化",
  sections: [
   { h: "ズレを数にする", t: `学習を始めるには「どれくらい間違えたか」を一つの数にする必要がある。それが【損失関数】（誤差関数）だ。回帰では予測と正解の差を二乗して平均する【平均二乗誤差】が代表的。分類では正解クラスに割り当てた確率が低いほど大きくなる【交差エントロピー】を使う。損失が小さいほど良いモデル、という単純な基準ができる。` },
   { h: "坂を下る", t: `重みを動かして損失を減らしたい。損失を重みで微分した値、すなわち【勾配】は、その重みを増やすと損失がどちらにどれだけ変わるかを教えてくれる。勾配と逆向きに少し動かせば損失は減る。これを繰り返すのが【勾配降下法】である。一歩の大きさが【学習率】。大きすぎると谷を飛び越えて発散し、小さすぎるといつまでも着かない。全データで勾配を計算するのは重いので、少数のデータをまとめた【ミニバッチ】ごとに更新する【確率的勾配降下法】（SGD）が実務の標準だ。全データを一巡することを【エポック】と呼ぶ。` },
   { h: "誤差を後ろへ流す", t: `何百万個もある重みの勾配を一つずつ求めるのは不可能に見える。しかし出力側の誤差から、微分の連鎖律で一つ手前の層、さらに手前の層へと勾配を順に計算できる。これが1986年に広まった【誤差逆伝播法】（バックプロパゲーション）である。ただし層が深いと、勾配を掛け合わせるうちに値がどんどん小さくなり、入力に近い層がほとんど学習しなくなる。これが【勾配消失問題】だ。シグモイドの微分は最大0.25なので、10層通せば0.25の10乗になる。ReLUが主流になった最大の理由はここにある。逆に大きくなりすぎるのが【勾配爆発】で、RNNでよく起きる。` },
   { h: "賢い下り方", t: `SGDは谷の底で右往左往しがちだ。そこで過去の勾配の方向を慣性として足す【モメンタム】、パラメータごとに学習率を自動調整する【AdaGrad】、その減衰しすぎを直した【RMSProp】、両者を組み合わせた【Adam】が生まれた。実務ではAdamが第一候補である。また、重みの初期値も学習の成否を分ける。シグモイド系には【Xavierの初期値】、ReLU系には【Heの初期値】が使われる。学習率をだんだん下げる【学習率スケジューリング】も定番だ。` },

  quiz: [

   { q: "学習率を大きくしすぎたときに起こりやすい現象はどれか。", choices: ["収束が遅くなる", "損失が発散する", "勾配が消失する", "過学習する"], a: 1, why: "谷を飛び越えて振動・発散。小さすぎると収束が遅い。" },
   { q: "勾配消失問題の説明として正しいものはどれか。", choices: ["学習率が小さすぎて重みが更新されない", "深い層で勾配が掛け合わされて小さくなり、入力側の層が学習しなくなる", "データが少なすぎて勾配を計算できない", "ミニバッチが大きすぎて勾配が平均化される"], a: 1, why: "シグモイドの微分（最大0.25）を層の数だけ掛けることが原因。ReLUで緩和。" },
   { q: "モメンタムとRMSPropの考え方を組み合わせた最適化手法はどれか。", choices: ["AdaGrad", "SGD", "Adam", "ニュートン法"], a: 2, why: "Adam＝Adaptive Moment Estimation。実務の標準的な第一選択。" },

{
  id: "d3", part: "dl", title: "7. 覚えすぎと戦う", lead: "過学習、正則化、評価指標",
  sections: [
   { h: "訓練データの丸暗記", t: `モデルが訓練データにだけ強く、新しいデータで外す状態を【過学習】（オーバーフィッティング）という。逆に訓練データにさえ合わない状態が【未学習】。見抜くには手持ちデータを【訓練データ】【検証データ】【テストデータ】に分け、訓練で学習、検証でハイパーパラメータを調整、テストで最終評価する。データが少ないときは分割を入れ替えて複数回評価する【交差検証】（k分割交差検証）が有効。手持ちデータでの成績と未知データでの成績の差を【汎化性能】の問題として意識するのが機械学習の作法である。` },
   { h: "縛りをかける", t: `過学習を抑える方法をまとめて【正則化】という。損失関数に重みの大きさを罰則として足すのが基本で、重みの絶対値の和を足す【L1正則化】（Lasso）は不要な重みを0にして特徴選択の効果があり、二乗和を足す【L2正則化】（Ridge）は重みを全体に小さくする。ニューラルネット特有の手法が【ドロップアウト】で、学習のたびにニューロンをランダムに無効化し、特定のニューロンへの依存を防ぐ。検証データの損失が上がり始めたら学習を止める【早期終了】、画像を回転・反転して訓練データを水増しする【データ拡張】も定番だ。` },
   { h: "層ごとに整える", t: `深いネットワークでは、前の層の出力分布が学習中に変わり続けて後ろの層が追いつけなくなる。これを抑えるのが【バッチ正規化】で、ミニバッチごとに各層の出力を平均0・分散1に整える。学習が安定し速くなり、正則化の効果もある。ドロップアウトやバッチ正規化、学習率、層数、ユニット数など、学習前に人が決める値を【ハイパーパラメータ】と呼ぶ。総当たりの【グリッドサーチ】やランダム探索、【ベイズ最適化】で調整する。` },
   { h: "正解率だけでは足りない", t: `分類の評価は【混同行列】から始まる。予測と正解の組み合わせをTP・FP・FN・TNに分けると、全体の正解割合が【正解率】（Accuracy）、「陽性と言ったもののうち本当に陽性」の割合が【適合率】（Precision）、「本当の陽性のうち見つけられた」割合が【再現率】（Recall）、両者の調和平均が【F値】である。病気の見逃しを避けたいなら再現率、誤警報を減らしたいなら適合率を重視する。しきい値を動かしたときの再現率と偽陽性率の曲線が【ROC曲線】、その下の面積【AUC】は1に近いほど良い。回帰では平均二乗誤差やその平方根【RMSE】、決定係数を使う。` },
  ],
  quiz: [
   { q: "ハイパーパラメータの調整に用いるべきデータはどれか。", choices: ["訓練データ", "検証データ", "テストデータ", "全データ"], a: 1, why: "テストデータで調整すると最終評価が甘くなる（テストへのリーク）。" },
   { q: "学習のたびにランダムにニューロンを無効化して過学習を抑える手法はどれか。", choices: ["バッチ正規化", "ドロップアウト", "早期終了", "L2正則化"], a: 1, why: "ドロップアウト（ヒントンら、2012年頃）。アンサンブル学習に似た効果。" },
   { q: "不要な重みを0にし、特徴選択の効果を持つ正則化はどれか。", choices: ["L1正則化", "L2正則化", "ドロップアウト", "データ拡張"], a: 0, why: "L1（Lasso）はスパースな解を作る。L2（Ridge）は重みを小さくするが0にはしにくい。" },
   { q: "「本当に陽性であるもののうち、モデルが陽性と予測できた割合」を表す指標はどれか。", choices: ["正解率", "適合率", "再現率", "F値"], a: 2, why: "再現率＝TP/(TP+FN)。見逃しを減らしたいときに重視する。" },

  sections: [
   { h: "全部つなぐのはもったいない", t: `画像をそのまま全結合層に入れると、隣り合う画素の関係が失われ、パラメータも爆発する。1998年のLeNet以来の答えが【畳み込みニューラルネットワーク】（CNN）である。小さな【フィルタ】（カーネル）を画像の上で少しずつずらしながら掛け算と足し算を行う【畳み込み】で、エッジや模様のような局所的な特徴を取り出す。同じフィルタを画像全体で使い回す（重み共有）ためパラメータが少なく、位置がずれても同じ特徴を検出できる。ずらす幅を【ストライド】、端に0を足して大きさを保つ操作を【パディング】という。` },
   { h: "縮めて、まとめる", t: `畳み込み層の後には【プーリング層】を置き、小さな領域の最大値（【最大プーリング】）や平均値を取って画像を縮める。位置の微妙な違いに強くなり、計算も減る。畳み込みとプーリングを何段も重ね、最後に【全結合層】で分類する、というのがCNNの基本形だ。浅い層は線や角、深い層は目や車輪のような部品、さらに深い層は物体全体に反応する。人間の視覚野の階層構造と似ている点が注目された。` },
   { h: "深くするための工夫", t: `AlexNet（2012年、8層）はReLUとドロップアウトとGPUを使った。VGG（2014年）は3×3の小さなフィルタだけを16〜19層重ね、GoogLeNet（2014年）は異なる大きさの畳み込みを並列に走らせる【Inceptionモジュール】を導入した。しかし単に深くすると学習が難しくなる。2015年の【ResNet】は入力をそのまま出力に足す【スキップ接続】（残差接続）を使い、152層でも学習できるようにした。これが「深さ」を実用にした決定打である。軽量化ではMobileNetの【深さ方向分離畳み込み】が知られる。` },

   { q: "ResNetが導入し、非常に深いネットワークの学習を可能にした仕組みはどれか。", choices: ["Inceptionモジュール", "スキップ接続", "最大プーリング", "深さ方向分離畳み込み"], a: 1, why: "残差接続。Inceptionは GoogLeNet、分離畳み込みはMobileNet。" },

{
  id: "d5", part: "dl", title: "9. 言葉と時間：RNNからTransformerへ", lead: "系列データ、LSTM、Attention、LLM",
  sections: [
   { h: "順番に意味がある", t: `文章や音声や株価は、順番に意味がある【系列データ】である。前の入力を覚えておく仕組みが【リカレントニューラルネットワーク】（RNN）で、隠れ状態を次の時刻に渡すことで文脈を保持する。学習には時間方向に展開して誤差逆伝播する【BPTT】を使うが、長い系列では勾配消失・爆発が起き、遠い過去を覚えられない。1997年に【ホッフライター】と【シュミットフーバー】が提案した【LSTM】は、記憶セルと入力・出力・忘却の【ゲート】で「何を覚え、何を忘れるか」を学習し、この弱点を克服した。ゲートを2つに簡略化した【GRU】もよく使われる。` },
   { h: "翻訳のための二本立て", t: `文を読んで別の文を出す翻訳には、読む側のRNN（エンコーダ）と書く側のRNN（デコーダ）をつなぐ【seq2seq】が使われた。だが文全体を一つのベクトルに押し込むため、長文で情報が落ちる。2014年に【バーダナウ】らが導入した【Attention】は、デコーダが出力の各単語を書くときに入力のどの単語を見るべきかを重み付けする仕組みで、この問題を解決した。単語をベクトルにする【単語埋め込み】も重要で、2013年の【word2vec】（ミコロフら）は「王−男+女≒女王」のような意味の演算ができることを示した。` },
   { h: "RNNを捨てる", t: `2017年のTransformerは、RNNを使わずAttentionだけで系列を扱う。文中の各単語が他のすべての単語との関係を計算する【自己注意機構】（Self-Attention）を複数並べた【マルチヘッドアテンション】が核で、順番の情報は【位置エンコーディング】で別途与える。RNNと違い全単語を同時に処理できるためGPUで並列化でき、巨大なモデルの訓練が現実になった。エンコーダだけを使うのがBERT、デコーダだけを使うのがGPTである。事前学習した大規模モデルを少量データで【ファインチューニング】する流れが、NLPの標準になった。` },
   { h: "大規模言語モデルとの付き合い方", t: `数百億パラメータを超えるモデルを【大規模言語モデル】（LLM）と呼ぶ。文章は【トークン】に分割されて処理され、扱える長さが【コンテキスト長】である。指示文の書き方で出力を制御するのが【プロンプトエンジニアリング】で、例を示す【Few-shot】、例なしの【Zero-shot】、途中の推論を書かせる【Chain-of-Thought】がある。もっともらしい嘘を生成する【ハルシネーション】への対策として、外部文書を検索して回答に添える【RAG】（検索拡張生成）が普及した。人間の好みに合わせる【RLHF】、指示に従うよう調整する【インストラクションチューニング】、文章と画像などを同時に扱う【マルチモーダル】も押さえておこう。` },
  ],
  quiz: [

   { q: "Transformerの特徴として誤っているものはどれか。", choices: ["自己注意機構を用いる", "RNNを用いずに系列を処理する", "単語を順番に一つずつ処理するため並列化できない", "位置エンコーディングで語順を与える"], a: 2, why: "全トークンを同時に処理できるため並列化でき、それが大規模化を可能にした。" },
   { q: "word2vecに関する説明として正しいものはどれか。", choices: ["単語を意味的な演算が可能なベクトルに変換する", "文章の感情を分類する", "画像から文章を生成する", "文を要約する"], a: 0, why: "2013年ミコロフら。skip-gram と CBOW の2方式。" },

{
  id: "d6", part: "dl", title: "10. 作る機械と、試す機械", lead: "生成モデルと強化学習",
  sections: [
   { h: "圧縮して、戻す", t: `入力を小さな次元に圧縮（エンコード）し、そこから元に戻す（デコード）よう学習するのが【オートエンコーダ】である。真ん中の圧縮表現は特徴抽出や次元削減、異常検知に使える。圧縮表現を確率分布として扱い、そこからサンプリングして新しいデータを作れるようにしたのが【変分オートエンコーダ】（VAE、2013年キングマら）で、生成モデルの入り口となった。` },
   { h: "偽札作りと警察", t: `2014年グッドフェローの【GAN】（敵対的生成ネットワーク）は、本物そっくりのデータを作る【生成器】と、本物か偽物かを見破る【識別器】を競わせる。偽札作りと警察が互いに腕を上げていくうちに、生成器は本物と区別できないデータを作れるようになる。訓練が不安定という弱点はあるが、高解像度の顔画像生成などで威力を示した。派生として、画像から画像への変換を行う【pix2pix】や【CycleGAN】がある。2020年の【拡散モデル】（DDPM）は、画像にノイズを少しずつ加える過程を学び、その逆を辿ってノイズから画像を生成する。学習が安定し、Stable DiffusionやDALL·E 2など現在の画像生成の主流になった。` },
   { h: "報酬で学ぶ", t: `教師データではなく行動の結果から学ぶのが【強化学習】である。【エージェント】が【環境】の【状態】を観測し【行動】を選ぶと【報酬】が返る。目的は将来の報酬の合計（累積報酬）を最大化する【方策】を見つけること。状態と行動の組の価値を推定する【Q学習】は代表的手法で、そのQ値をニューラルネットで近似したのが2013〜2015年DeepMindの【DQN】である。Atariゲームを画面だけから人間以上に上手くプレイした。方策を直接学ぶ【方策勾配法】、価値と方策を同時に学ぶ【Actor-Critic】もある。新しい行動を試す【探索】と、良いと分かった行動を選ぶ【活用】のバランスが常に課題だ。` },
   { h: "深層強化学習の到達点", t: `AlphaGoは人間の棋譜で教師あり学習した後、自己対局による強化学習と【モンテカルロ木探索】を組み合わせた。2017年の【AlphaGo Zero】は人間の棋譜をまったく使わず自己対局だけで前作を上回り、同年の【AlphaZero】は囲碁・将棋・チェスを同じ手法で制した。強化学習は大規模言語モデルにも使われている。RLHFは「人間が好む回答」を報酬として言語モデルを調整する手法で、ChatGPTの対話品質を作った。ロボット制御や広告配信、データセンターの冷却最適化など、実世界への応用も広がっている。` },
  ],
  quiz: [
   { q: "GANの構成として正しいものはどれか。", choices: ["エンコーダとデコーダ", "生成器と識別器", "エージェントと環境", "Actor と Critic"], a: 1, why: "生成器（Generator）と識別器（Discriminator）を敵対的に学習。グッドフェロー、2014。" },
   { q: "ノイズを段階的に加える過程を学習し、その逆過程でデータを生成するモデルはどれか。", choices: ["VAE", "GAN", "拡散モデル", "オートエンコーダ"], a: 2, why: "拡散モデル（DDPM、2020）。Stable Diffusion などの基盤。" },
   { q: "強化学習において、行動の結果として環境から返される評価値を何というか。", choices: ["損失", "報酬", "勾配", "方策"], a: 1, why: "報酬。方策は状態から行動を決めるルール。" },
   { q: "Q学習のQ関数を深層ニューラルネットワークで近似した手法はどれか。", choices: ["DQN", "AlphaZero", "seq2seq", "ResNet"], a: 0, why: "DQN（Deep Q-Network、DeepMind）。Atariゲームで人間超え。" },

{
  id: "d7", part: "dl", title: "細部で差がつく：学習を支える技術", lead: "計算資源、活性化関数の派生、距離学習の損失、正規化の種類、RNNの細部",
  sections: [
   { h: "計算機がブームを作った", t: `深層学習が2012年に花開いた理由の一つは計算機である。画像処理用に作られた【GPU】は単純な演算を大量に並列実行でき、行列計算だらけのニューラルネットに向いていた。画像以外の汎用計算にGPUを使う考え方を【GPGPU】という。Googleはさらに機械学習の演算に特化した【TPU】を開発した。CPUは複雑な処理を少数のコアで順番にこなすのが得意で、GPUは単純な処理を数千のコアで同時にこなすのが得意、と対比して覚える。ネットワークの中身は、入力に重みを掛けて足す線形変換を行う【全結合層】と、非線形性を担う活性化関数の繰り返しである。` },
   { h: "ReLUの弱点を直す", t: `ReLUは負の入力を0にするため、あるニューロンの出力が常に0になると勾配も0になり、以後まったく学習しなくなる。これが【dying ReLU】だ。対策として負側にわずかな傾きを持たせた【Leaky ReLU】、その傾きを学習する【PReLU】、負側を滑らかな曲線にした【ELU】などの派生が生まれた。損失関数にも派生がある。分類では【KLダイバージェンス】、すなわち二つの確率分布の隔たりを測る量が交差エントロピーの背後にある。「似たものは近く、違うものは遠く」を学ぶ距離学習では、二つの入力の距離を使う【Contrastive Loss】や、基準・正例・負例の3つ組を使う【Triplet Loss】が使われ、顔認証などに応用される。` },
   { h: "勾配の暴走を止め、分布を整える", t: `深いネットワークや長いRNNでは勾配が爆発することがある。勾配のノルムに上限を設けて切り詰める【勾配クリッピング】は単純で効く対策だ。損失の地形には、ある方向には谷でも別の方向には山という【鞍点】があり、勾配がほぼ0なので学習が止まったように見える。モメンタムやAdamはここを抜けやすい。1エポックはデータ全体を1周すること、【イテレーション】はミニバッチ1回分の更新で、両者を混同しない。正規化にも種類がある。ミニバッチ単位で整えるバッチ正規化は小さなバッチで不安定になるため、1サンプル内の全特徴で整える【レイヤー正規化】がTransformerの標準になった。画像のスタイル変換では各サンプル各チャネルごとに整える【インスタンス正規化】、チャネルをまとめて整える【グループ正規化】もある。` },
   { h: "RNNの細部", t: `RNNの原型には、隠れ層の出力を次時刻に戻す【エルマンネットワーク】と、出力層の値を戻す【ジョルダンネットワーク】がある。LSTMが長期記憶を保てる核は、誤差を減衰させずに保持する【CEC】（Constant Error Carousel）で、ゲートがそこへの書き込みと忘却を制御する。文脈を前からだけでなく後ろからも読む【双方向RNN】は、文全体が手に入る翻訳や品詞タグ付けで有効だ。系列を生成する学習では、前時刻の自分の予測ではなく正解を次の入力に与える【教師強制】（Teacher Forcing）を使うと学習が安定するが、推論時には自分の予測を使うため条件の差が生じる。` },
  ],
  quiz: [
   { q: "ReLUで負側の出力が0のまま学習が進まなくなる現象を緩和するために、負側にわずかな傾きを持たせた活性化関数はどれか。", choices: ["シグモイド関数", "Leaky ReLU", "ソフトマックス関数", "ステップ関数"], a: 1, why: "dying ReLU対策。傾きを学習させるPReLUもある。" },
   { q: "レイヤー正規化がバッチ正規化より適するのはどのような場面か。", choices: ["画像分類でバッチサイズを大きく取れるとき", "データが完全に静的なとき", "GPUが1台しかないとき", "バッチサイズが小さい場合や、系列長が可変の場合（Transformerなど）"], a: 3, why: "バッチ正規化はバッチ内統計に依存するため、小バッチでは統計が不安定になる。" },
   { q: "勾配爆発への対策として、勾配のノルムに上限を設ける手法はどれか。", choices: ["勾配クリッピング", "ドロップアウト", "早期終了", "データ拡張"], a: 0, why: "RNNなど時間方向に深いネットワークでよく使う。" },
   { q: "教師強制（Teacher Forcing）の説明として正しいものはどれか。", choices: ["教師データの件数を増やす手法", "正則化手法の一種", "転移学習の手法", "系列生成の学習時に、前時刻の予測ではなく正解を次時刻の入力として与える手法"], a: 3, why: "学習は安定するが、推論時との条件の差が生じる点に注意。" },
   { q: "GPUがディープラーニングに適している理由として最も適切なものはどれか。", choices: ["複雑な分岐処理を高速に実行できるから", "単純な演算を多数のコアで並列に実行でき、行列計算に向くから", "メモリ容量がCPUより常に大きいから", "消費電力がCPUより常に小さいから"], a: 1, why: "画像以外に使う考え方がGPGPU。Googleは機械学習専用のTPUを開発した。" },
  ]
},
{
  id: "a1", part: "app", title: "音を聞き、言葉を数える", lead: "音声処理の前処理と古典手法、自然言語処理の基礎技術",
  sections: [
   { h: "波を数字に変える", t: `マイクが拾うアナログの音声波形は、一定間隔で値を測る【A-D変換】でデジタル信号になる。時間領域の波形を周波数成分に分解するのが【高速フーリエ変換】（FFT）だ。周波数特性の概形を【スペクトル包絡】といい、そこに現れる複数の山を【フォルマント】と呼ぶ。低い順に第1、第2フォルマントといい、母音の違いはこの位置で決まる。人間の耳は低い周波数の違いに敏感で高い周波数には鈍い。その聴覚特性に合わせて周波数を変換した【メル尺度】の上でスペクトル包絡を表した特徴量が【MFCC】（メル周波数ケプストラム係数）で、長く音声認識の標準的な入力だった。` },
   { h: "音から文字へ", t: `言語で意味の区別に使われる音の最小単位を【音素】という。深層学習以前の音声認識は、観測される音響特徴の背後にある状態遷移を確率的にモデル化する【隠れマルコフモデル】（HMM）が中核だった。ニューラルネットで直接文字列を出す際の難題は、音声のフレームと文字の対応が事前に分からないことである。入力系列と出力系列の対応付けなしに学習できる損失【CTC】がこれを解いた。逆に文字から音声を作るのが音声合成で、DeepMindの【WaveNet】は波形のサンプルを自己回帰的に直接生成し、自然さを一気に引き上げた。音声から話者が誰かを当てるのは【話者識別】で、音声認識とは別のタスクだ。` },
   { h: "言葉を切って数える", t: `日本語の文は単語の切れ目が見えない。文を最小の意味単位に分割し品詞を付ける処理が【形態素解析】である。言語処理はここから始まる。連続するn個の単語の並びを単位にするのが【N-gram】で、次の単語の出現確率を統計的に扱う古典的な言語モデルだ。文書を単語の出現回数のベクトルにするのが【Bag-of-Words】、語順は捨てる。単語の重みづけには、その文書での出現頻度と、多くの文書に現れる語ほど下がる逆文書頻度を掛けた【TF-IDF】を使う。文法規則を人手で書く方式から、大量テキストの統計的性質に基づく【統計的自然言語処理】へ移ったことが、後の機械翻訳や検索の土台になった。` },
   { h: "意味を数字に埋め込む", t: `単語を密なベクトルで表す【分散表現】は、似た意味の単語が近くに置かれる。word2vecの後、単語を部分文字列に分けて未知語にも対応した【fastText】、文脈によって同じ単語でも違うベクトルにする【ELMo】が出て、Transformer系のBERTにつながった。ベクトルの近さは大きさでなく向きで測る【コサイン類似度】で比べるのが定番だ。応用タスクには、文の肯定・否定を判定する【感情分析】、文書中の人名や地名を拾う【固有表現抽出】、機械翻訳がある。翻訳の自動評価には正解訳とのN-gramの一致率を測る【BLEU】が使われる。` },
  ],
  quiz: [
   { q: "MFCC（メル周波数ケプストラム係数）とはどれか。", choices: ["画像の局所特徴量", "単語埋め込みの一種", "時系列の移動平均", "音声のスペクトル包絡を人間の聴覚特性に沿った尺度で表した特徴量"], a: 3, why: "音声認識で広く用いられてきた古典的特徴量。メル尺度に基づく。" },
   { q: "CTC（Connectionist Temporal Classification）の説明として正しいものはどれか。", choices: ["画像分割の手法", "正則化手法の一種", "入力系列と出力系列の対応が事前に分からなくても学習できるようにする損失・アルゴリズム", "生成モデルの一種"], a: 2, why: "音声認識や手書き文字認識で、フレームと文字の対応付けを不要にする。" },
   { q: "WaveNetの説明として正しいものはどれか。", choices: ["音声認識専用のモデル", "音声波形を直接生成する音声合成モデル", "画像を生成するモデル", "機械翻訳モデル"], a: 1, why: "自己回帰的に波形サンプルを生成し、自然な音声合成を実現した（DeepMind）。" },

{
  id: "a2", part: "app", title: "少ないデータで、賢く学ぶ", lead: "データ拡張、転移学習、自己教師あり学習、半教師あり学習",
  sections: [
   { h: "1枚を何枚にも", t: `学習データを人工的に増やすのが【データ拡張】である。画像なら回転・反転・切り出し（Crop）のような幾何的な操作と、明るさ（Brightness）やコントラストを変える画素値の操作がある。2枚の画像とラベルを線形に混ぜる【Mixup】、画像の一部を別の画像で置き換える【CutMix】、一部を黒く塗りつぶす【Cutout】や【Random Erasing】は、部分的な情報だけに依存しないようモデルを頑健にする。どの操作をどの強さで使うかを無作為に選び、探索の手間を省くのが【RandAugment】だ。音声にはノイズを加え、テキストには言い換え（paraphrasing）を使う。` },
   { h: "拡張してはいけないもの", t: `データ拡張は学習データに対して行う。テストデータに同じ拡張を適用すると本番条件を再現できず、評価の意味が失われる。また数字や文字の認識で上下反転すると6が9になるように、拡張はラベルの意味を壊すことがある。タスクの性質に合わせて選ぶのが原則だ。もう一つの落とし穴が第2部で触れたデータリーケージで、拡張前の同じ画像が学習と検証の両方に入ると性能を過大評価する。分割してから拡張する、が手順である。` },
   { h: "他人の学習を借りる", t: `大量データで学習済みのモデルの知識を別のタスクに活用する枠組みが【転移学習】である。出力層付近だけを新しいデータで学習する方法も、既存の層のパラメータまで更新する【ファインチューニング】も、どちらも転移学習に含まれる。学習データが数百枚しかない画像分類でも、ImageNetで学習済みのモデルを土台にすれば実用精度に届く。ただし新しいタスクを学ぶ過程で以前の知識が失われる【破滅的忘却】に注意し、学習率を小さくする、一部の層を凍結するなどで緩和する。生成AIを特定業務に合わせるときも、まずプロンプトで済むかを検討し、足りなければファインチューニング、という順序が経済的だ。` },
   { h: "ラベルがなくても学べる", t: `ラベル付けは高い。そこでラベルなしデータから、データ自身の一部を隠して当てさせるなどの方法で疑似的な教師信号を作って学習するのが【自己教師あり学習】である。BERTの穴埋めもGPTの次単語予測もこれで、大規模な事前学習を可能にし基盤モデルの土台になった。少量のラベルありデータと大量のラベルなしデータを併用するのが【半教師あり学習】だ。関連して、1つのモデルで複数のタスクを同時に学び共通の表現を共有する【マルチタスク学習】は汎化に効くが、相性の悪いタスクどうしは互いの性能を下げる【負の転移】を起こすことがある。` },
  ],
  quiz: [
   { q: "データ拡張の運用として適切でないものはどれか。", choices: ["画像の回転・反転・切り出しを行う", "評価を安定させるため、テストデータにも同じ拡張を適用して精度を測る", "Mixupで2枚の画像とラベルを線形に混ぜる", "Random Erasingで画像の一部を隠す"], a: 1, why: "拡張は学習データに対して行う。テストデータを加工すると本番条件を再現できない。" },
   { q: "2枚の画像と正解ラベルを線形に混ぜ合わせるデータ拡張はどれか。", choices: ["Cutout", "Mixup", "RandAugment", "Crop"], a: 1, why: "CutMixは一部を別画像で置換、Cutoutは一部を消す。" },
   { q: "転移学習とファインチューニングの関係として正しいものはどれか。", choices: ["両者は完全に同義である", "転移学習では必ず全パラメータを更新する", "ファインチューニングでは学習を一切行わない", "転移学習は事前学習済みモデルの知識を別タスクに活用する枠組みで、ファインチューニングはその際に既存の層のパラメータも更新する方法を指す"], a: 3, why: "出力層付近だけを学習する方法も転移学習に含まれる。" },
   { q: "破滅的忘却（catastrophic forgetting）とはどれか。", choices: ["新しいタスクを学習する過程で、以前に獲得した知識が失われてしまう現象", "保存したデータが物理的に破損する障害", "勾配が0に近づく現象", "モデルを圧縮する手法"], a: 0, why: "ファインチューニング時に問題となり、学習率の調整や一部層の凍結で緩和する。" },
   { q: "自己教師あり学習の説明として正しいものはどれか。", choices: ["ラベルのないデータから、データ自身の一部を隠すなどして疑似的な教師信号を作り出して学習する方式", "人手でラベルを付与して学習する方式", "報酬信号のみを用いて学習する方式", "教師データを一切使わずクラスタを作る方式"], a: 0, why: "大規模な事前学習を可能にし、基盤モデルの土台となった。" },
  ]
},
{
  id: "a3", part: "app", title: "画像の先へ：認識の広がりとマルチモーダル", lead: "セグメンテーションと姿勢推定、軽量CNN、ViT、生成の発展、画像と言葉の融合",
  sections: [
   { h: "画像認識タスクの地図", t: `画像に何が写っているかを既知のカテゴリで当てるのが【一般物体認識】で、特定の個体を同定する特定物体認識と区別する。位置を矩形で囲むのが物体検出、画素ごとにクラスを割り当てるのがセグメンテーションだ。同じクラスの個体を区別しないセマンティック、個体まで区別するインスタンス、両者を統合し背景（stuff）と個体（things）の全画素を扱う【パノプティックセグメンテーション】がある。Faster R-CNNにマスク予測の分岐を加えた【Mask R-CNN】がインスタンス分割の代表で、【DeepLab】は解像度を保ちつつ受容野を広げるAtrous Convolutionで、【PSPNet】はピラミッド型プーリングで大域的な文脈を取り込む。人物の関節位置を推定するのが【姿勢推定】で、複数人に対応する【OpenPose】が知られる。異なる解像度の特徴マップを組み合わせ、小さな物体の検出を改善するのが【FPN】だ。` },
   { h: "深く、広く、軽く", t: `深さだけが性能を決めるわけではない。【Wide ResNet】は層を深くする代わりにチャネル幅を広げ、【EfficientNet】は深さ・幅・入力解像度をバランスよく同時にスケールさせて少ない計算量で高精度を出した。チャネルごとの重要度を学習して重み付けする【SENet】もある。スマートフォンで動かすには軽さが要る。【MobileNet】はDepthwise Separable Convolutionで計算量を抑え、【MnasNet】は実機の推論速度まで目的関数に入れて構造を自動探索した。この構造自動探索を【NAS】（Neural Architecture Search）という。そして2020年、画像を小さなパッチに分割して単語の列のように扱い、TransformerでCNN並みの精度を出した【Vision Transformer】（ViT）が登場した。` },
   { h: "生成の広がり", t: `生成モデルにも系譜がある。GANに畳み込みを組み込んで安定させた【DCGAN】、ペア画像で変換を学ぶpix2pix、ペアなしで変換するCycleGANと続いた。VAEの潜在変数を離散化した【VQ-VAE】は、後の画像生成モデルのトークン化に使われる。複数視点の写真から3次元シーンを学習し新しい視点の画像を描く【NeRF】は、画像生成が3次元に広がった例だ。音声生成ではWaveNetのように波形を直接作る方式が主流になった。` },
   { h: "画像と言葉をつなぐ", t: `複数の種類のデータを同時に扱うのがマルチモーダルである。OpenAIのCLIPは画像とテキストを同じ埋め込み空間で対応づけて学習し、学習していないクラスでも「これは犬の写真」という文との近さで分類できる。この、例示なしで未知のクラスに対応する能力が【ゼロショット】で、少数の例示で対応するのがFew-shot、例示が1つならOne-shotである。文章から画像を作る【Text-to-Image】はDALL·EやStable Diffusionが代表、画像に説明文を付けるのが【画像キャプション生成】、画像と質問を入力して答える【VQA】（Visual Question Answering）もある。少数例で多様な視覚言語タスクをこなす【Flamingo】、画像もテキストも統一形式で扱い一つのモデルで多くのタスクを解く【Unified-IO】は、タスクごとにモデルを分けない方向を示した。基盤モデルは規模を大きくしても学習データの偏りは自動的には解消しない、という注意も添えておく。` },
  ],
  quiz: [
   { q: "Vision Transformer（ViT）の説明として正しいものはどれか。", choices: ["画像をパッチに分割し、系列とみなしてTransformerで処理する", "畳み込み層のみで構成される", "音声処理専用のモデルである", "教師なし学習にしか使えない"], a: 0, why: "大規模データでの事前学習によりCNNに匹敵・凌駕する性能を示した。" },
   { q: "Mask R-CNNの説明として正しいものはどれか。", choices: ["画像分類専用のモデル", "姿勢推定専用のモデル", "意味的領域分割のみを行う", "Faster R-CNNにマスク予測の分岐を加え、インスタンスセグメンテーションを実現した"], a: 3, why: "検出とマスク生成を同時に行う。" },
   { q: "CLIPの説明として正しいものはどれか。", choices: ["音声と映像を同期させるモデル", "画像を高解像度化するモデル", "画像とテキストを同じ埋め込み空間で対応づけて学習し、ゼロショット分類などを可能にするモデル", "動画を自動要約するモデル"], a: 2, why: "マルチモーダルモデルの代表例で、Text-to-Image生成の基盤にもなっている。" },
   { q: "EfficientNetの特徴として正しいものはどれか。", choices: ["再帰構造により系列を処理する", "深さ・幅・入力解像度をバランスよく同時にスケールさせ、少ない計算量で高い精度を達成した", "全結合層のみで構成される", "教師なし学習専用のモデルである"], a: 1, why: "compound scalingと呼ばれる考え方。MobileNetは軽量化、NASは構造の自動探索。" },
   { q: "Few-shot学習に関する記述として適切でないものはどれか。", choices: ["少数の例示で新しいタスクに対応することを指す", "大規模な事前学習済みモデルで効果を発揮しやすい", "例示の数が少ないほど常に精度が高くなる", "One-shotは例示が1つの場合を指す"], a: 2, why: "一般に例示が増えるほど精度は上がりやすい。少数で済むことが利点。" },
  ]
},
{
  id: "a4", part: "app", title: "中身を説明し、軽くする", lead: "説明可能AI（XAI）の手法、蒸留・プルーニング・量子化、エッジAI",
  sections: [
   { h: "なぜその答えなのか", t: `融資審査や医療診断のように判断が個人の権利や生命に影響する場面では、精度だけでなく根拠の説明が求められる。モデルの判断根拠を人が理解できる形で提示し、検証・改善・説明責任を果たせるようにする取り組みが【XAI】（説明可能AI）である。解釈性と精度はしばしばトレードオフで、説明可能にすれば精度が上がるわけではない。またブラックボックス問題はソースコードの非公開とは別で、入出力の関係が複雑で人が把握しにくいことを指す。` },
   { h: "どこを見て、何が効いたか", t: `画像なら「どこを見たか」を示す。【CAM】はグローバルアベレージプーリングを持つ構造を前提に、判別に寄与した領域を可視化する。この構造上の制約を勾配の利用で取り払い、多くのCNNにそのまま使えるようにしたのが【Grad-CAM】で、注目領域をヒートマップで描く。特徴量なら「何が効いたか」を示す。【LIME】は個々の予測の近傍を単純な線形モデルで近似して局所的に説明し、モデルの中身を問わない。【SHAP】は協力ゲーム理論のシャープレイ値を使い、各特徴量の寄与を公平に配分して、局所的にも大域的にも解釈できる。ある特徴量の値をランダムに並べ替えて性能の低下量から重要度を測る【Permutation Importance】は、再学習なしで任意のモデルに使える。` },
   { h: "大きなモデルを小さくする三つの道", t: `端末側の計算資源・メモリ・電力には限りがあり、応答時間の要求も厳しい。モデルを小さくする【モデル圧縮】の代表が三つある。大きな教師モデルの出力を小さな生徒モデルに学習させる【蒸留】は、正解ラベルだけでなく「どのクラスと紛らわしいか」を含む確率分布（ソフトターゲット）を移す。重要度の低い重みや接続を削除するのが【プルーニング】で、大きなネットワークの中に単独で学習しても同等の性能を出せる部分ネットワークが存在するという【宝くじ仮説】が理論的な裏付けとして議論される。重みや活性値を低ビットで表現してメモリと計算を減らすのが【量子化】だ。いずれも多少の精度低下を伴うので、許容範囲を業務要件から先に決める。` },
   { h: "端末で判断する", t: `クラウドに送らず端末側で推論する仕組みが【エッジAI】である。低遅延で、オフラインでも動き、データを外部に出さないためプライバシー面でも有利だ。代わりに計算資源が限られるので、蒸留・プルーニング・量子化による軽量化が前提になる。大規模モデルや集中的な更新が必要ならクラウド推論、両方を組み合わせるハイブリッド構成も取られる。要件から選ぶ設計判断であり、常にどちらかが正しいわけではない。` },
  ],
  quiz: [
   { q: "LIMEの説明として正しいものはどれか。", choices: ["モデル全体の挙動を厳密に解析する", "学習アルゴリズムの一種である", "個々の予測の近傍を単純なモデルで近似し、その予測を局所的に説明する", "特徴量を自動生成する"], a: 2, why: "モデルの内部構造を問わない（model-agnostic）手法。SHAPはシャープレイ値に基づく。" },
   { q: "CAMとGrad-CAMの関係として正しいものはどれか。", choices: ["両者は無関係な手法である", "CAMはGAPを持つ構造に限定されるが、Grad-CAMは勾配を用いることで構造上の制約を緩和した", "Grad-CAMのほうが先に提案された", "どちらも自然言語処理専用の手法である"], a: 1, why: "Grad-CAMは多くのCNNにそのまま適用できる点が実用上の利点。" },
   { q: "蒸留（Distillation）の説明として正しいものはどれか。", choices: ["重みの一部を0にして接続を削除する", "数値の表現ビット数を落とす", "大きな教師モデルの出力を小さな生徒モデルに学習させ、性能を保ったまま軽量化する", "層をスキップして推論する"], a: 2, why: "1はプルーニング、2は量子化。" },
   { q: "宝くじ仮説の内容として正しいものはどれか。", choices: ["学習の成否は運任せであるという主張", "モデルが大きいほど必ず高性能になるという主張", "大きなネットワークの中に、単独で学習しても同等の性能を出せる部分ネットワークが存在するという仮説", "初期値は学習結果に影響しないという主張"], a: 2, why: "プルーニングの理論的な裏付けとして議論されている。" },
   { q: "エッジAIの利点として最も適切なものはどれか。", choices: ["モデルサイズの制約がなくなる", "端末上で大規模な学習を実行できる", "常時ネットワーク接続が必要になる", "端末側で推論するため低遅延で、データを外部に送信せずに済むためプライバシー面の利点もある"], a: 3, why: "端末の計算資源が限られるため、軽量化が前提となる。" },
  ]
},
{
  id: "a5", part: "app", title: "AIプロジェクトを回す", lead: "CRISP-DM、PoC、MLOps、データの収集とアノテーション、運用と危機管理",
  sections: [
   { h: "課題から始める", t: `AI活用の出発点は最新モデルの選定ではなく、解決すべき業務課題と「達成できた」と判断する基準を定義することだ。誰のどの課題を解くかが定まらないと、技術的に成功しても使われないシステムになる。データ分析の標準手順【CRISP-DM】は、ビジネス理解→データ理解→データ準備→モデリング→評価→展開を反復する。機械学習向けに本番運用・監視・保守まで含めて拡張したのが【CRISP-ML】である。既存の業務プロセス自体を根本から見直すことを【BPR】といい、AI導入はしばしばこれを伴う。自社に足りないデータや知見は他企業や大学との連携で補う。ただし知財と秘密保持の設計はむしろ重要になる。` },
   { h: "小さく試して、進むか止めるか", t: `本格導入の前に、実現可能性と効果を小規模に検証するのが【PoC】（概念実証）である。次の段階へ進むかを判断するためのもので、中止の判断ができることも重要な成果だ。精度目標や許容できる誤りの基準は要件定義の段階で合意し、後付けにしない。要件や成果が不確実なAI開発では、短い反復で検証しながら進めるアジャイル的な進め方が適することが多いが、契約と検収の設計と整合させる。開発環境ではコードと実行結果を対話的に記述できる【Jupyter Notebook】、依存ライブラリごと実行環境を再現可能にまとめる【Docker】などのコンテナ技術、必要なときに計算資源を増減できるクラウドが道具になる。Pythonが広く使われるのはライブラリが充実し検証を素早く回せるからで、速度が要る部分は低レイヤの実装に委ねられている。` },
   { h: "データを集め、正解を付ける", t: `学習用データに正解ラベルを付ける作業が【アノテーション】である。品質と一貫性が精度を左右するため、基準書を整備し、作業者間の一致度を確認する。自然言語処理で使う大規模な言語データの集合を【コーパス】という。公開されていて誰でも使える【オープンデータセット】は便利だが、商用可否・再配布・帰属表示などのライセンス条件と、含まれるデータの権利や偏りを確認する。研究用途限定のデータセットを商用利用して問題になった例がある。複数組織でデータを共有して共同開発するなら、利用範囲、学習済みモデルなど派生物の扱い、責任分担を事前に取り決めておく。` },
   { h: "作って終わりではない", t: `モデルの開発から本番運用・監視・再学習までを継続的に回す取り組みが【MLOps】である。本番運用中のモデルは、市場環境や顧客行動の変化で学習時の前提が崩れ、数か月かけて精度が落ちていく。これを【コンセプトドリフト】と呼び、定期的な再学習とモニタリングが対策になる。監視すべきは予測性能の推移、入力データの分布変化、推論の遅延やエラー率で、正解がすぐ得られないときは入力分布の変化が早期警報になる。AIをWeb APIとして提供すれば更新を一元管理できるが、モデル窃取や可用性のリスク管理が要る。有事の連絡体制、対応手順、社会への説明窓口を事前に用意する【クライシス・マネジメント】も、問題が起きてから考えるのでは遅い。` },
  ],
  quiz: [
   { q: "CRISP-DMの説明として正しいものはどれか。", choices: ["モデルを圧縮する手順", "ビジネス理解→データ理解→データ準備→モデリング→評価→展開という反復的なデータ分析プロセス", "AI開発の契約類型", "統計的仮説検定の手順"], a: 1, why: "機械学習向けに拡張したものがCRISP-ML。" },
   { q: "PoC（概念実証）の目的として正しいものはどれか。", choices: ["本番システムを完成させること", "契約金額を確定すること", "学習データを外部に販売すること", "実現可能性と効果を小規模に検証し、次フェーズへ進むかを判断すること"], a: 3, why: "中止の判断ができることもPoCの重要な成果。" },
   { q: "本番運用中のモデルの精度が数か月かけて徐々に低下した。最も疑うべき原因はどれか。", choices: ["学習率の設定ミス", "GPUの物理的故障", "入力データや対象の性質が時間とともに変化したこと（コンセプトドリフト）", "正則化が不足していること"], a: 2, why: "定期的な再学習とモニタリングが対策。" },

   { q: "AIシステムのクライシス・マネジメントとして適切でないものはどれか。", choices: ["有事の連絡体制と対応手順をあらかじめ定めておく", "実際に問題が起きるまで対応方針は決めない", "社会に対する説明の窓口と方針を用意しておく", "発生した事象をプロジェクト計画にフィードバックする"], a: 1, why: "事後対応の速さが被害と信頼喪失を左右するため、事前準備が本質。" },

{
  id: "a6", part: "app", title: "数理・統計の最低限", lead: "代表値と散らばり、相関と因果、確率分布、推定と検定、距離と情報量",
  sections: [
   { h: "真ん中と、ばらつき", t: `データの代表値は三つ。全部足して割る【平均】、並べて真ん中の【中央値】、最も多く現れる【最頻値】だ。中央値は順位に基づくので【外れ値】の影響を最も受けにくい。散らばりは平均からの差の二乗の平均である【分散】と、その平方根の【標準偏差】で表す。分散は単位が二乗になるため、解釈には元のデータと同じ単位の標準偏差を使う。データを階級に分けて出現数を数えたものが度数分布で、図にしたものが【ヒストグラム】である。時系列では一定区間の平均を順次計算して短期変動を平滑化する【移動平均】がよく使われる。` },
   { h: "相関は因果ではない", t: `二つの変数が一緒に変動する度合いが【共分散】で、単位に影響される。それを各変数の標準偏差で割って−1〜1に標準化したのが【相関係数】だ。直線的な関係の強さと向きを表すが、因果関係の強さではない。アイスの売上と水難事故は相関するが、共通の原因は気温である。第三の変数【交絡因子】の影響で見かけ上の相関が生じることを【疑似相関】といい、その影響を取り除いて2変数の関係を測るのが【偏相関係数】である。非線形な関係も含めて二つの変数がどれだけ情報を共有するかを測るのが【相互情報量】だ。` },
   { h: "確率のことば", t: `Bが起きたという条件のもとでAが起きる確率が【条件付き確率】P(A|B)で、事前確率を観測データで更新する【ベイズの定理】はこの条件付き確率を反転させる関係式である。確率変数の取りうる値をその確率で重み付けして平均したものが【期待値】。分布の代表は、平均と標準偏差で形が決まり平均±1σに約68%、±2σに約95%が入る【正規分布】。成功・失敗の2値を扱う【ベルヌーイ分布】をn回繰り返した成功回数が従うのが【二項分布】、単位時間あたりの稀な事象の発生回数が従うのが【ポアソン分布】だ。連続型では関数の値そのものは確率でなく、区間で積分して確率になる【確率密度関数】を使い、1点の確率は0である。` },
   { h: "推定と検定、距離と近さ", t: `観測データが得られる確率、すなわち尤度が最大になるようパラメータを選ぶのが【最尤法】で、残差の二乗和を最小にする【最小二乗法】とは、誤差が正規分布に従う仮定のもとで一致する。母数を幅で推定するのが【区間推定】。検定では「差がない」という【帰無仮説】を立て、主張したい【対立仮説】のために棄却を目指す。【p値】は帰無仮説が正しいと仮定したとき観測以上に極端な結果が得られる確率であり、帰無仮説が正しい確率ではない。帰無仮説が真なのに棄却するのが【第一種の誤り】（確率が有意水準α）、偽なのに棄却しないのが【第二種の誤り】で、検出力は1−βだ。サンプルが大きいと小さな差でも有意になるので効果量も見る。距離は2点間の直線距離【ユークリッド距離】が基本で、データの相関を考慮して平均からの距離を測る【マハラノビス距離】、ベクトルの向きの近さを測るコサイン類似度も使い分ける。` },
  ],
  quiz: [
   { q: "外れ値の影響を最も受けにくい代表値はどれか。", choices: ["平均", "分散", "中央値", "標準偏差"], a: 2, why: "順位に基づくため極端な値に強い。" },
   { q: "疑似相関の説明として正しいものはどれか。", choices: ["相関係数が0である状態", "相関係数の計算を誤った状態", "因果が双方向に働いている状態", "第三の変数（交絡因子）の影響で、直接の関係がない2変数に見かけ上の相関が生じること"], a: 3, why: "アイスの売上と水難事故（共通原因は気温）が典型例。" },
   { q: "正規分布の性質として正しいものはどれか。", choices: ["左右非対称な分布である", "平均と標準偏差で形が決まり、平均±1σにおよそ68%が含まれる", "離散型の確率分布である", "平均・中央値・最頻値が一致しない"], a: 1, why: "±2σで約95%。平均・中央値・最頻値は一致する。" },
   { q: "p値の説明として適切でないものはどれか。", choices: ["帰無仮説が正しい確率を表す", "小さいほど、観測されたデータが帰無仮説のもとでは起こりにくいことを示す", "有意水準と比較して判断に用いる", "効果の大きさそのものを表すわけではない"], a: 0, why: "p値は「帰無仮説が正しいと仮定したとき、観測以上に極端な結果が得られる確率」。最頻出のひっかけ。" },
   { q: "最尤法の説明として正しいものはどれか。", choices: ["残差の二乗和を最小にするパラメータを選ぶ", "分散を最小にするパラメータを選ぶ", "事前分布を最大にするパラメータを選ぶ", "観測されたデータが得られる確率（尤度）が最大になるようパラメータを選ぶ"], a: 3, why: "1は最小二乗法。誤差が正規分布に従う仮定の下では両者は一致する。" },
  ]
},
{
  id: "l1", part: "law", title: "11. データと権利", lead: "著作権法30条の4、個人情報保護法、不正競争防止法、GDPR",
  sections: [
   { h: "学習に使ってよいのか", t: `ある企業がネット上の画像100万枚を集めてAIに学習させた。著作権者の許諾は取っていない。日本では、これは原則として適法である。2018年改正（2019年1月施行）の【著作権法30条の4】が、【情報解析】など「著作物に表現された思想又は感情を自ら享受することを目的としない利用」を許諾なしで認めているからだ。日本が「機械学習パラダイス」と呼ばれる理由である。ただし例外がある。学習と同時に鑑賞目的（享受目的）が併存する場合や、「著作権者の利益を不当に害する」場合（例：データセットとして販売されている著作物を無断で使う）は適用外だ。` },
   { h: "作ったものは誰のものか", t: `一方で「生成物」の話は別である。AIが自律的に作った画像や文章は、人の「思想又は感情の創作的表現」ではないので、原則として【著作物】に当たらない。人がプロンプトや修正で創作的に関与した部分は保護され得る。また生成物が既存の著作物と似ていて（【類似性】）、それを基にしている（【依拠性】）と認められれば、通常の著作権侵害になる。特許についても、AIを発明者とする出願は日本では認められないとする裁判例が出ている（DABUS事件、2024年東京地裁・2025年知財高裁で「発明者は自然人に限る」と判断。最終確定状況は未確認）。` },
   { h: "人に関するデータ", t: `【個人情報保護法】は2003年成立・2005年全面施行で、その後3年ごとの見直しが続く。氏名や顔画像など特定の個人を識別できる情報が【個人情報】。人種・病歴・犯罪歴など差別につながりやすいものは【要配慮個人情報】で、取得に本人同意が原則必要（2015年改正で導入）。個人を特定できないよう加工し復元不能にした【匿名加工情報】は本人同意なく第三者提供できる。他の情報と照合しなければ個人を識別できない程度に加工した【仮名加工情報】（2020年改正で導入、2022年4月施行）は、社内分析用途で利用目的変更などの規制が緩和される。EUの【GDPR】（2018年5月適用）は、【忘れられる権利】や【データポータビリティ権】、自動化された決定のみに服さない権利などを定め、違反には巨額の制裁金がある。日本はGDPRとの間で十分性認定を受けている。` },
   { h: "秘密とデータ", t: `著作権で守れない「データそのもの」を守るのは【不正競争防止法】である。秘密として管理され、有用で、公然と知られていない情報が【営業秘密】。2018年改正（2019年施行）で、会員限定で提供されるビッグデータなどを守る【限定提供データ】の制度が加わった。企業がAI開発を委託するときは、学習用データ、学習済みモデル、生成物の権利帰属を契約で決める必要がある。経済産業省の【AI・データの利用に関する契約ガイドライン】（2018年、2019年改訂）は、開発の段階を「アセスメント→PoC→開発→追加学習」に分けて契約類型を示している。` },
  ],
  quiz: [
   { q: "日本の著作権法30条の4に関する説明として正しいものはどれか。", choices: ["AI学習のための著作物の利用には常に権利者の許諾が必要である", "情報解析など享受を目的としない利用は原則として許諾なく認められる", "生成AIの出力物には自動的に著作権が発生する", "営業秘密の保護について定めている"], a: 1, why: "2018年改正・2019年施行。ただし享受目的併存や権利者の利益を不当に害する場合は除く。" },
   { q: "AIが自律的に生成した画像の著作物性についての一般的な考え方はどれか。", choices: ["AIに著作権が帰属する", "利用者に自動的に著作権が帰属する", "人の創作的関与がなければ著作物に当たらない", "開発企業に著作権が帰属する"], a: 2, why: "著作物は「思想又は感情を創作的に表現したもの」。プロンプト等で創作的寄与があれば保護され得る。" },
   { q: "「他の情報と照合しない限り特定の個人を識別できないように加工した個人に関する情報」はどれか。", choices: ["要配慮個人情報", "匿名加工情報", "仮名加工情報", "個人関連情報"], a: 2, why: "仮名加工情報（2020年改正）。匿名加工情報は復元不能な加工で、第三者提供も可。" },
   { q: "GDPRに定められている権利として正しいものはどれか。", choices: ["忘れられる権利（消去権）", "AIを発明者とする特許権", "限定提供データの権利", "著作物を自由に学習に使う権利"], a: 0, why: "GDPR（2018年5月適用）。消去権、データポータビリティ権、自動化された決定に服さない権利など。" },
   { q: "不正競争防止法の2018年改正で新設された、会員限定で提供されるデータ等を保護する制度はどれか。", choices: ["営業秘密", "限定提供データ", "匿名加工情報", "情報解析"], a: 1, why: "限定提供データ。営業秘密の3要件（秘密管理性・有用性・非公知性）を満たさないデータを保護。" },
  ]
},
{
  id: "l2", part: "law", title: "12. AIをどう律するか", lead: "原則、ガイドライン、AI法、EU AI Act、倫理の論点",
  sections: [
   { h: "原則から始まった", t: `AIの規律は「原則」から始まった。2019年3月、日本政府は【人間中心のAI社会原則】を公表し、人間中心、教育・リテラシー、プライバシー確保、セキュリティ確保、公正競争確保、公平性・説明責任・透明性、イノベーションの7原則を掲げた。同年5月には【OECD AI原則】が採択され、G20も支持した。2023年5月のG7広島サミットでは生成AIをめぐる国際ルール作りとして【広島AIプロセス】が立ち上がり、12月に高度なAIシステムを開発する組織向けの国際指針・行動規範を含む包括的政策枠組みがまとまった。` },
   { h: "事業者のための一冊", t: `国内の指針は2024年4月に【AI事業者ガイドライン】へ統合された（総務省・経済産業省）。従来の3つのガイドラインを一本化したもので、AIに関わる主体を【AI開発者】【AI提供者】【AI利用者】の3つに分け、それぞれが取り組むべき事項を示す。法的拘束力のないソフトローで、【アジャイル・ガバナンス】の考え方に基づき毎年更新される「リビングドキュメント」である。2025年3月に第1.1版、2026年3月31日に第1.2版が公表され、AIエージェントの定義などが追記された。` },
   { h: "日本の法律とEUの法律", t: `2025年5月28日、日本で【AI法】（人工知能関連技術の研究開発及び活用の推進に関する法律、通称AI推進法）が成立し、6月4日公布、9月1日に全面施行された。内閣に【AI戦略本部】を置き【AI基本計画】を策定する基本法で、事業者への罰則はなく、イノベーション促進とリスク対応の両立を掲げる。対照的にEUの【EU AI Act】（AI規則、2024年8月発効）は、AIを【許容できないリスク】（禁止）【高リスク】（厳格な義務）【限定的リスク】（透明性義務）【最小リスク】の4段階に分けて規制する世界初の包括的AI法だ。禁止規定は2025年2月、【汎用目的AI】（GPAI）の義務は2025年8月に適用開始。高リスクAIの義務は当初2026年8月の予定だったが、2026年のデジタルオムニバスで2027年12月以降に延期された。EU域外の企業でもEU市場に提供すれば対象になる。` },
   { h: "倫理の論点を事例で", t: `米国の再犯予測システム【COMPAS】は、黒人被告を高リスクと誤判定する割合が白人より高いと2016年に報道された。学習データに含まれる偏りがモデルに再生産される【アルゴリズムバイアス】の代表例だ。Amazonが採用AIを取りやめた事例（女性を低評価）も同じ構造である。対策として、判断根拠を示す【説明可能なAI】（XAI）、開発初期からプライバシーを組み込む【プライバシー・バイ・デザイン】、誰が責任を負うかを明確にする【アカウンタビリティ】が求められる。生成AI特有の問題として、実在人物の偽動画【ディープフェイク】、学習データが個人情報や著作物を含むリスク、AIの目的を人間の価値観と揃える【アライメント】がある。倫理・法・社会的影響をまとめて【ELSI】と呼び、技術と並行して考えるのが現在の標準である。` },
  ],
  quiz: [
   { q: "AI事業者ガイドラインが対象とする3つの主体はどれか。", choices: ["国・自治体・企業", "AI開発者・AI提供者・AI利用者", "研究者・エンジニア・経営者", "製造業・サービス業・行政"], a: 1, why: "2024年4月に総務省・経産省が3つの従来ガイドラインを統合。法的拘束力のないソフトロー。" },
   { q: "EU AI Actのリスク分類として正しいものはどれか。", choices: ["高・中・低の3段階", "許容できないリスク・高リスク・限定的リスク・最小リスクの4段階", "禁止・許可の2段階", "レベル1〜5の5段階"], a: 1, why: "リスクベースアプローチ。許容できないリスクは禁止、高リスクには厳格な義務。" },
   { q: "2025年に成立した日本のAI法の性格として正しいものはどれか。", choices: ["違反企業に高額の制裁金を課す規制法", "AI戦略本部とAI基本計画を定める基本法で、事業者への罰則はない", "EU AI Actをそのまま国内法化したもの", "著作権法の特別法"], a: 1, why: "人工知能関連技術の研究開発及び活用の推進に関する法律。2025年5月成立、9月全面施行。" },
   { q: "COMPASの事例が示した問題はどれか。", choices: ["ハルシネーション", "アルゴリズムバイアス", "勾配消失", "シンボルグラウンディング問題"], a: 1, why: "学習データの偏りが再犯予測の人種差として現れた（2016年ProPublica報道）。" },
   { q: "広島AIプロセスに関する説明として正しいものはどれか。", choices: ["2019年にOECDが採択したAI原則", "2023年のG7で始まった生成AIに関する国際的なルール作りの枠組み", "2024年に発効したEUのAI規制法", "日本の個人情報保護委員会の指針"], a: 1, why: "2023年5月G7広島サミットで立ち上げ、12月に包括的政策枠組みを合意。" },
   { q: "「人間中心のAI社会原則」（2019年、日本）に含まれないものはどれか。", choices: ["人間中心の原則", "プライバシー確保の原則", "公平性・説明責任・透明性の原則", "AIの人格権の原則"], a: 3, why: "7原則：人間中心／教育・リテラシー／プライバシー確保／セキュリティ確保／公正競争確保／公平性・説明責任・透明性／イノベーション。" },
  ]
},
{
  id: "l3", part: "law", title: "発明、競争、契約", lead: "特許法、独占禁止法、AI開発の契約類型、サービス利用時の確認事項",
  sections: [
   { h: "著作権と特許は生まれ方が違う", t: `著作権は創作した時点で自動的に発生する無方式主義だが、【特許権】は出願し審査を経て登録されて初めて発生する。守るのは技術的思想の創作、すなわち【発明】だ。特許を受けるには、出願前に公然と知られていない【新規性】、当業者が容易に思いつくものでない【進歩性】、そして【産業上の利用可能性】が要る。学会で先に発表すると新規性を失う点は研究者が最も注意するところだ。存続期間は原則として出願日から20年で、著作権の「死後70年」とは数え方が違う。会社員の発明は【職務発明】として、契約や勤務規則で会社に権利を帰属させられるが、相当の利益を発明者に与える必要がある。日本では発明者は自然人が前提で、AIを発明者と認めるかは国際的に議論が続いている。特許・著作権・商標権・意匠権などをまとめて【知的財産権】と呼ぶ。` },
   { h: "公開して独占するか、隠して守るか", t: `特許は内容を公開する代わりに独占権を得る制度である。対して営業秘密は公開せず、非公知である限り保護され続ける。模倣されやすい製品技術は特許、外から見えない内部プロセスは営業秘密、という使い分けが一般的だ。競争の場面ではもう一つ、【独占禁止法】が関わる。競合各社が同じ価格最適化アルゴリズムを使った結果、市場価格が事実上そろってしまう【アルゴリズムによる協調】は、人が合意していなくてもカルテルと同様の競争制限になりうると懸念されている。自由競争の減殺や取引上の地位の濫用など、公正な競争を阻害するおそれを【公正競争阻害性】という。` },
   { h: "完成を約束できない開発", t: `AI開発の契約で最初に決めるのは契約類型だ。仕事の完成を約束する【請負契約】に対し、【準委任契約】は善管注意義務のもとで業務の遂行に責任を負う。AI開発ではデータを見るまで達成できる精度が分からないため、探索的な段階には準委任がなじむ。経済産業省の【AI・データの利用に関する契約ガイドライン】は、アセスメント→【PoC】→開発→追加学習と段階を分け、各段階に適した契約を割り当てる探索的段階型の方式を示した。精度は「保証させるか否か」ではなく、評価方法・評価データ・未達時の扱いを取り決めるのが実務である。技術情報のやり取りには【秘密保持契約】（NDA）を結び、成果物の知財の帰属、提供データの利用範囲、モデル劣化時の再学習の費用負担を保守契約で定めておく。` },
   { h: "外のAIサービスを使うとき", t: `自社で作らず、SaaS型のAIサービスを使う場面も増えた。ここで確認すべき中心は【データ利用権】、つまり入力したデータを提供者がどこまで使えるかである。機密文書を生成AIに入力して要約させるなら、その入力が提供者側の再学習に使われるか、利用停止（オプトアウト）ができるかを利用規約で確かめる。「規約は一律だから確認不要」は誤りで、業務上許容できない条項があれば個別交渉や別サービスの検討が必要になる。サービス停止時の対応、出力に関する責任分担も契約で定める論点だ。` },
  ],
  quiz: [
   { q: "特許権と著作権の違いとして正しいものはどれか。", choices: ["どちらも登録なしに権利が発生する", "どちらも出願と登録が必要である", "特許権は出願・審査を経て登録により発生し、著作権は創作した時点で発生する", "両者の保護対象は同一である"], a: 2, why: "著作権は無方式主義。特許は技術的思想の創作（発明）を保護する。" },
   { q: "特許権の存続期間として正しいものはどれか。", choices: ["創作の時から70年", "原則として出願日から20年", "登録から永久", "存続期間の定めはない"], a: 1, why: "著作権は原則として著作者の死後70年で、期間の考え方が異なる。" },
   { q: "AI開発において探索的段階に準委任契約が用いられやすい理由はどれか。", choices: ["費用が必ず安く済むため", "成果物の権利が自動的に発注者に帰属するため", "秘密保持が不要になるため", "データを見るまで達成可能な精度が分からず、完成義務を負う契約になじみにくいため"], a: 3, why: "経産省のAI・データ契約ガイドラインが探索的段階型の開発方式を示している。" },
   { q: "SaaS型のAIサービスを業務利用する際に確認すべき事項として最も適切なものはどれか。", choices: ["入力したデータが提供者側の再学習に利用されるかどうか、および利用停止の可否", "提供者が用いる開発言語", "開発担当者の学歴", "サーバ機器の製造元"], a: 0, why: "機密情報や個人データの取扱いに直結するため、利用規約とデータ処理条件の確認が要点。" },
   { q: "競合他社と同じ価格最適化アルゴリズムを導入した結果、市場価格が事実上そろった。関係する法律はどれか。", choices: ["著作権法", "独占禁止法", "不正競争防止法", "特許法"], a: 1, why: "アルゴリズムによる協調。人の合意がなくても競争制限と評価されうる。" },
  ]
},
{
  id: "l4", part: "law", title: "倫理の各論を事例で", lead: "プライバシー、セキュリティ、偽情報、情報環境、環境負荷、労働、包摂",
  sections: [
   { h: "集めるときと、推定するとき", t: `プライバシーの問題は二段階ある。収集時の同意だけでなく、提供された情報自体は機微でなくても、推論によって病歴や信条などの機微な属性が推定されうる【推論段階のプライバシー】だ。購買履歴から妊娠の可能性が推定された事例が知られる。企画・設計の段階からプライバシー保護を組み込む考え方が【プライバシー・バイ・デザイン】で、同じ発想をセキュリティに適用したのが【セキュリティ・バイ・デザイン】である。店舗の防犯カメラ映像をAIで分析するなら、国内の【カメラ画像利活用ガイドブック】が配慮事項をまとめている。` },
   { h: "AIを狙う攻撃", t: `AIシステム固有の攻撃を四つ押さえる。標識に人間には気づかない微小な摂動を加えて別の標識と誤認識させるのが【敵対的攻撃】（Adversarial Attack）、その入力を【敵対的サンプル】という。学習データに悪意あるデータを混入させてモデルの挙動を歪めるのが【データ汚染】（ポイズニング）。公開APIに問い合わせを繰り返して入出力を集め、同等のモデルを再現するのが【モデル窃取】。出力を手がかりに学習データの内容を推定・復元するのが【データ窃取】だ。配布されたモデルに悪意ある改変が加えられ特定条件で誤動作する【モデル汚染】もある。単一の対策で完全には防げないため、敵対的サンプルを学習に加える、入力の前処理や異常検知を組み合わせる、レート制限をかけるなど多層的に防御する。稀な入力での破滅的な失敗に備え、フェイルセーフや停止手段を設計するのが安全性の基本である。` },
   { h: "本物そっくりの偽物と、閉じた情報環境", t: `AIで生成した偽の映像・音声を【ディープフェイク】と呼ぶ。役員の声を模した偽音声で送金を指示するような被害が実際に起きている。対策は検知技術、生成物への電子透かしや来歴情報の付与、プラットフォームの表示ルール、メディアリテラシー教育の組み合わせで、研究開発の全面禁止は正当な利用まで阻害し実効性も乏しい。推薦アルゴリズムが個人に最適化した情報ばかりを提示し、多様な視点に触れにくくなる現象が【フィルターバブル】、似た意見の者どうしの交流が閉じて同じ意見が増幅される現象が【エコーチェンバー】である。両者は世論の分極化を招き、選挙の公正性に影響しうると懸念されている。推薦や誘導で人の意思決定が知らぬ間に操作される問題は【人間の自律性】の論点として扱われる。` },
   { h: "電力、仕事、そして誰のためのAIか", t: `大規模モデルの学習は多大な電力を消費する。学習・推論の効率化、事前学習済みモデルの再利用、再生可能エネルギーの利用が【環境負荷】への対応として議論され、一方でAIが省エネや気候変動対策に貢献する面もある。労働への影響は、定型業務の代替と新たな業務の創出の両面があり、雇用が必ず純減すると決まっているわけではない。人手不足の領域を補う期待と、AIへの依存で人が自ら判断する技能を失う【スキルの喪失】の懸念が並ぶ。年齢・障害の有無・言語にかかわらず使えるよう、設計と評価の段階から多様な利用者を想定する考え方が【インクルージョン】だ。最後に【デュアルユース】、民生と軍事の両方に使えるという技術の性質である。自律型致死兵器をめぐる国際的な議論が続いており、研究成果の公開範囲や提供先の条件を含む影響評価が企業にも求められる。` },
  ],
  quiz: [
   { q: "推論段階で生じるプライバシー問題の説明として正しいものはどれか。", choices: ["データ収集時の同意の有無のみが問題となる", "提供された情報自体は機微でなくても、推論によって病歴や信条などの機微な属性が推定されうる", "通信の暗号化強度に関する問題である", "学習データの保存容量に関する問題である"], a: 1, why: "収集段階と推論段階の問題は区別して考える。" },
   { q: "公開APIへの問い合わせを繰り返して入出力を収集し、同等の機能を持つモデルを再現する行為はどれか。", choices: ["敵対的攻撃", "データ汚染", "モデル窃取", "ディープフェイク"], a: 2, why: "レート制限や出力粒度の設計が対策。敵対的攻撃は微小な摂動、データ汚染は学習データへの混入。" },
   { q: "ディープフェイクへの対策として適切でないものはどれか。", choices: ["生成物への電子透かしや来歴情報の付与", "生成AIの研究開発そのものを全面的に禁止する", "偽動画・偽音声を検知する技術の開発", "流通プラットフォームにおける表示ルールの整備"], a: 1, why: "全面禁止は正当な利用まで阻害し実効性も乏しい。技術・制度・運用を組み合わせる。" },
   { q: "似た意見を持つ者同士の交流が閉じ、同じ意見が反復・増幅されていく現象はどれか。", choices: ["フィルターバブル", "エコーチェンバー", "イライザ効果", "AI効果"], a: 1, why: "フィルターバブルは個人最適化された情報ばかりが提示される現象。両者は相まって分極化を招く。" },
   { q: "民生用途と軍事用途の両方に使えるという技術の性質を何というか。", choices: ["デュアルユース", "インクルージョン", "アライメント", "トレーサビリティ"], a: 0, why: "公開範囲や提供先の条件を含む影響評価が求められる。" },
  ]
},
{
  id: "l5", part: "law", title: "ガバナンスを組織に組み込む", lead: "ソフトロー、リスクベース、透明性と来歴、アセスメント、監査、AIポリシー",
  sections: [
   { h: "縛る法律と、縛らない規範", t: `法的拘束力を持つ法律や規則が【ハードロー】、拘束力を持たないガイドラインや業界規範が【ソフトロー】である。技術変化の速いAI分野では、まずソフトローで柔軟に対応し、必要な部分をハードロー化する流れが取られてきた。日本のAI事業者ガイドラインはソフトロー、EU AI Actはハードローだ。規制の強さを一律にせず、用途のリスクの大きさに応じて変える考え方が【リスクベースアプローチ】で、EU AI Actの4分類がその代表例である。国内外のAI原則は表現こそ違うが、人間中心、公平性、透明性・説明可能性、安全性、プライバシーという【価値原則】を共有している。法令に明記されていない事項も検討対象にするのがAI倫理であり、法令遵守だけでは足りない。` },
   { h: "説明できる状態をつくる", t: `モデルの内部処理が把握できない状態を【ブラックボックス】と呼ぶ。ソースコードが非公開であることとは別の問題だ。透明性とは、全パラメータを公開することではなく、学習データの来歴、利用目的、判断の根拠を利用者が理解できる形で示すことである。その基盤が、学習データやモデルの由来・変更履歴を記録する【データの来歴】（プロベナンス）と、問題発生時に原因を追跡できる【トレーサビリティ】だ。乱数シード、実行環境、データのバージョンを固定して同じ結果を再現できる【再現性】がなければ、検証も原因究明も説明もできない。` },

  $("ttl").textContent = "G検定";
  const readN = Object.keys(S.read).length, ansN = Object.keys(S.q).length;
  let h = `<div class="hero"><h1>年号と人物を、<br>物語として読む。</h1><p>読んで、章末で解いて、忘れる頃に復習する。${PARTS.length}つの部、${CHAPTERS.length}章、${QS.length}問。</p>
  <div class="stat"><div><b>${readN}</b>/${CHAPTERS.length} 章読了</div><div><b>${ansN}</b>/${QS.length} 問着手</div><div><b>${dueCards().length}</b> 復習待ち</div></div></div>`;
  PARTS.forEach(p => {
    h += `<section class="part"><h2>${esc(p.name)}</h2><p class="sub">${esc(p.sub)}</p>`;
    CHAPTERS.filter(c => c.part===p.id).forEach(c => {
      const r = S.read[c.id]; const sc = chapScore(c);
      h += `<button class="row" onclick="go({name:'chapter',id:'${c.id}'})"><div class="t"><b>${esc(c.title)}</b><span>${esc(c.lead)}</span></div><div class="st ${sc&&sc.c===sc.n?"ok":""}">${sc?`${sc.c}/${sc.n}`:(r?"読了":"")}</div></button>`;
    });
    h += `</section>`;
  });
  h += `<button class="cta sec" style="margin-top:28px" onclick="go({name:'about'})">この教材について・出典の確認状況</button>`;
  $("main").innerHTML = h;
}
function chapScore(c){ let n=0,cc=0; c.quiz.forEach((q,i)=>{const s=S.q[c.id+"-"+i]; if(s){n++; if(s.ok) cc++;}}); return n?{n:c.quiz.length,c:cc}:null; }

// ---- chapter ----
function mark(t){
  return esc(t).replace(/【([^】]+)】/g, (_,k) => TERMS[k] ? `<span class="m" role="button" tabindex="0" onclick="term('${esc(k).replace(/'/g,"\\'")}')">${esc(k)}</span>` : `<span class="m no">${esc(k)}</span>`);
}
function rChapter(){
  const c = CHAPTERS.find(x => x.id===view.id); const i = CHAPTERS.indexOf(c);
  $("ttl").textContent = c.title;
  let h = `<p class="lead">${esc(c.lead)}</p><article>`;
  c.sections.forEach(s => h += `<h2>${esc(s.h)}</h2><p>${mark(s.t)}</p>`);
  h += `</article><p class="note">マーカーの語はタップで意味が出ます。</p>`;
  const sc = chapScore(c);
  h += `<button class="cta" onclick="startQuiz({chap:'${c.id}'})">${sc?`章末問題をもう一度（前回 ${sc.c}/${sc.n}）`:"章末問題を解く（"+c.quiz.length+"問）"}</button>`;
  h += `<div class="chapnav">${i>0?`<button onclick="go({name:'chapter',id:'${CHAPTERS[i-1].id}'})">‹ ${esc(CHAPTERS[i-1].title)}</button>`:"<span></span>"}${i<CHAPTERS.length-1?`<button onclick="go({name:'chapter',id:'${CHAPTERS[i+1].id}'})">${esc(CHAPTERS[i+1].title)} ›</button>`:""}</div>`;
  $("main").innerHTML = h;
  if(!S.read[c.id]){ S.read[c.id]=1; save(); }
}
function term(k){
  const added = S.terms.includes(k);
  openSheet(`<h3>${esc(k)}</h3><p>${esc(TERMS[k])}</p><button class="cta ${added?"sec":""}" onclick="toggleTerm('${esc(k).replace(/'/g,"\\'")}')">${added?"復習カードから外す":"復習カードに追加"}</button>`);
}
function toggleTerm(k){ const i=S.terms.indexOf(k); if(i>=0) S.terms.splice(i,1); else S.terms.push(k); save(); term(k); renderTabs(); }
function openSheet(html){ $("sheet").innerHTML = `<div class="grab"></div>`+html; $("sheet").classList.add("on"); $("sheetbg").classList.add("on"); }
function closeSheet(){ $("sheet").classList.remove("on"); $("sheetbg").classList.remove("on"); }
$("sheetbg").onclick = closeSheet;

// ---- quiz ----
function rQuizHome(){
  $("ttl").textContent = "解く";
  const w = wrongQs().length;
  let h = `<div class="hero"><h1>本番と同じ、四択で。</h1><p>回答すると正誤と解説がすぐ出ます。間違えた問題は「復習」にも溜まります。</p></div>`;
  h += `<button class="cta" onclick="startQuiz({n:10})">全範囲からランダム10問</button>`;
  h += `<button class="cta sec" onclick="startQuiz({n:20})">全範囲からランダム20問</button>`;
  h += `<button class="cta sec" ${w?"":"disabled style='opacity:.4'"} onclick="startQuiz({wrong:1})">間違えた問題だけ（${w}問）</button>`;
  h += `<section class="part"><h2>部ごとに解く</h2>`;
  PARTS.forEach(p => { const n = QS.filter(q=>q.part===p.id).length; h += `<button class="row" onclick="startQuiz({part:'${p.id}'})"><div class="t"><b>${esc(p.name)}</b><span>${n}問</span></div><div class="st">›</div></button>`; });
  h += `</section>`;
  $("main").innerHTML = h;
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function startQuiz(o){
  let list;
  if(o.chap) list = QS.filter(q=>q.chap===o.chap);
  else if(o.part) list = shuffle(QS.filter(q=>q.part===o.part));
  else if(o.wrong) list = shuffle(wrongQs());
  else list = shuffle(QS.slice()).slice(0,o.n);
  if(!list.length) return;
  go({name:"run", list, i:0, score:0, done:false, picked:null, tab: o.chap?"home":"quiz"});
}
function rRun(){
  const v = view; const q = v.list[v.i];
  $("ttl").textContent = v.list.length===QS.length?"全問":"問題";
  if(v.done){
    const pct = Math.round(100*v.score/v.list.length);
    $("main").innerHTML = `<div class="result"><div class="big">${v.score}<span style="font-size:22px;color:var(--mute)"> / ${v.list.length}</span></div><p>${pct>=80?"合格圏。次の章へ進みましょう。":pct>=60?"あと少し。解説を読み直すと定着します。":"間違えた問題を「復習」で繰り返しましょう。"}</p></div>
    <div class="opts"><button class="cta" onclick="back()">戻る</button>${v.wrongList.length?`<button class="cta sec" onclick="startQuiz({wrong:1})">今回の間違いを含む復習（${wrongQs().length}問）</button>`:""}</div>`;
    return;
  }
  let h = `<div class="qhead"><span>${v.i+1} / ${v.list.length}</span><span>${esc(CHAPTERS.find(c=>c.id===q.chap).title)}</span></div><div class="qbar"><i style="width:${100*v.i/v.list.length}%"></i></div><p class="q">${esc(q.q)}</p>`;
  q.choices.forEach((c,k) => {
    let cls="ch"; if(v.picked!==null){ if(k===q.a) cls+=" ok"; else if(k===v.picked) cls+=" ng"; }
    h += `<button class="${cls}" ${v.picked!==null?"disabled":""} onclick="pick(${k})">${esc(c)}</button>`;
  });
  if(v.picked!==null){
    const ok = v.picked===q.a;
    h += `<div class="why"><b class="${ok?"ok":"ng"}">${ok?"正解":"不正解 — 正答は「"+esc(q.choices[q.a])+"」"}</b>${esc(q.why)}</div><button class="cta" onclick="nextQ()">${v.i+1<v.list.length?"次の問題":"結果を見る"}</button>`;
  }
  $("main").innerHTML = h;
}
function pick(k){
  const v = view; if(v.picked!==null) return; const q = v.list[v.i]; v.picked = k;
  const ok = k===q.a; const s = S.q[q.id] || {w:0,c:0}; if(ok){ s.c++; s.ok=1; } else { s.w++; s.ok=0; } S.q[q.id]=s; save();
  if(ok) v.score++; else (v.wrongList=v.wrongList||[]).push(q.id);
  render();
}
function nextQ(){ const v=view; v.wrongList=v.wrongList||[]; if(v.i+1<v.list.length){ v.i++; v.picked=null; } else v.done=true; render(); window.scrollTo(0,0); }

// ---- review ----
function rReview(){
  $("ttl").textContent = "復習";
  const cards = allCards(); const d = today();
  const cnt = t => cards.filter(c=>(!t||c.type===t)&&cardState(c.id).due<=d).length;
  const boxes = [0,0,0,0,0,0]; cards.forEach(c=>boxes[Math.min(cardState(c.id).box,5)]++);
  const w = wrongQs().length;
  let h = `<div class="hero"><h1>忘れる頃に、もう一度。</h1><p>「覚えた」を押すほど次に出るまでの間隔が延びます（1日→3日→7日→14日→30日）。「まだ」で最初に戻ります。</p></div>`;
  h += `<div class="boxes">${["新規","1日","3日","7日","14日","30日"].map((l,i)=>`<div><b>${boxes[i]}</b>${l}</div>`).join("")}</div>`;
  h += `<button class="cta" ${cnt()?"":"disabled style='opacity:.4'"} onclick="go({name:'cards',type:null,tab:'review'})">今日の復習カード（${cnt()}枚）</button>`;
  h += `<div class="two"><button class="cta sec" onclick="go({name:'cards',type:'year',tab:'review'})">年号 ${cnt("year")}</button><button class="cta sec" onclick="go({name:'cards',type:'person',tab:'review'})">人物 ${cnt("person")}</button><button class="cta sec" onclick="go({name:'cards',type:'term',tab:'review'})">用語 ${cnt("term")}</button></div>`;
  h += `<button class="cta sec" style="margin-top:22px" ${w?"":"disabled style='opacity:.4;margin-top:22px'"} onclick="startQuiz({wrong:1})">間違えた問題を解き直す（${w}問）</button>`;
  h += `<p class="note" style="margin-top:20px">本文のマーカー語をタップして追加したカード：${S.terms.length}枚。すべて出し切ったら、明日また来てください。</p>`;
  $("main").innerHTML = h;
}
function rCards(){
  const v = view; $("ttl").textContent = ({year:"年号",person:"人物",term:"用語"})[v.type] || "今日の復習";
  if(!v.queue){ v.queue = shuffle(dueCards(v.type)).slice(0,25); v.flip=false; v.n=v.queue.length; v.okn=0; }
  if(!v.queue.length){ $("main").innerHTML = `<div class="result"><div class="big">${v.okn}<span style="font-size:22px;color:var(--mute)"> / ${v.n}</span></div><p>この回の分は終わりです。残りがあれば「復習」タブの枚数に出ます。</p></div><button class="cta" onclick="back()">戻る</button>`; return; }
  const c = v.queue[0]; const kind = ({year:"この年の出来事は？",person:"この人物の業績は？",term:"この用語の意味は？"})[c.type];
  let h = `<div class="qhead"><span>残り ${v.queue.length}</span><span>${["新規","1日","3日","7日","14日","30日"][Math.min(cardState(c.id).box,5)]}</span></div>`;
  h += `<button class="card" onclick="flip()"><div class="k">${kind}</div><div class="f">${esc(c.f)}</div>${v.flip?`<div class="b">${esc(c.b)}</div>`:""}</button>`;
  if(v.flip) h += `<div class="two"><button class="cta ng" onclick="grade(0)">まだ</button><button class="cta ok" onclick="grade(1)">覚えた</button></div>`;
  else h += `<button class="cta sec" onclick="flip()">答えを見る</button>`;
  $("main").innerHTML = h;
}
function flip(){ view.flip = !view.flip; render(); }
function grade(ok){
  const v = view; const c = v.queue.shift(); const st = cardState(c.id);
  if(ok){ st.box = Math.min(st.box+1, 5); st.due = today() + INTERVALS[st.box]; v.okn++; }
  else { st.box = 0; st.due = today(); v.queue.push(c); }
  S.cards[c.id] = st; save(); v.flip=false; render();
}

// ---- about ----

  $("ttl").textContent = "この教材について";
  $("main").innerHTML = `<div class="about">
  <p>G検定シラバス2024（2024年11月「G検定2024 #6」以降、第1.4版）の技術分野8大項目・法律/倫理分野2大項目を、読み物として再構成したものです。公式テキストの代替ではなく、記憶の「取っ掛かり」を作るためのものとして使ってください。</p>
  <h3>出典の確認状況（2026年9月2日時点）</h3>
  <ul>

  <li>AI法（AI推進法）：2025年5月28日成立、6月4日公布、9月1日全面施行（政府広報・法律事務所解説の2ソースで確認）。</li>
  <li>EU AI Act：2024年8月発効、禁止規定2025年2月、GPAI義務2025年8月適用。高リスクAI義務は2026年のデジタルオムニバスで2027年12月（附属書III）／2028年8月（附属書I）へ延期（複数の解説記事で確認。透明性義務の適用日は資料により2026年8月と12月の記述があり<b>未確認</b>）。</li>
  <li>AI史の年号・人物：広く確立した事実として記載し、個別のウェブ照合は行っていません。試験直前には公式テキスト第3版で照合してください。</li>
  <li>DABUS事件（AI発明者）の最終確定状況：<b>未確認</b>。</li>
  <li>第2部・第4部および3章・16章・25〜27章（2026年9月追加）：手元の対策問題集（シラバス2024 第1.4版準拠、小項目S1〜S37・L1〜L18）と照合して執筆。JDLA公式シラバス原本との直接照合は<b>未実施</b>。</li>
  </ul>

  <h3>章の追加</h3>

  <button class="danger" onclick="if(confirm('学習記録（読了・正誤・復習カード）をすべて消します。よろしいですか？')){localStorage.removeItem('${KEY}');S=load();tab('home');}">学習記録をリセット</button>
  </div>`;
}
